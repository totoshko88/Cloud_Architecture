      icon: { id: mxgraph.aws4.bedrock, name: Amazon Bedrock, hex: "#01A88D" }
    azure:
      label: Azure OpenAI
      aliases: [azure_openai, cognitive_services, openai, azurerm_cognitive_account]
      icon: { id: azure.cognitive_services, name: Azure OpenAI Service, hex: "#0078D4" }
    gcp:
      label: Vertex AI
      aliases: [vertex_ai, vertexai, aiplatform, google_vertex_ai]
