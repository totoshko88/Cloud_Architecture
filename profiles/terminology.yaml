# Single source of truth for the neutral-concept -> per-provider terminology,
# native-type aliases, and seed icon metadata (REVIEW.md finding C1).
#
# This file is the authoritative machine-readable form of the terminology
# normalization table declared in `.kiro/steering/provider-profiles.md`. The
# core modules READ from it rather than each hard-coding its own copy:
#
#   - rule_engine.contract   -> native display `label` per provider
#   - rule_engine.normalizer -> native-type `aliases` -> neutral resource_type
#   - rule_engine.assets.enumerate -> seed `icon` (id / name / brand_hex)
#
# Adding a provider is therefore a data change here (plus the icon mapping YAML
# and a golden example), never a change to core Python. A CI test
# (tests/test_terminology_source.py) asserts every core module and the steering
# table agree with this file.
#
# Structure:
#   providers: ordered list of the five Provider Profile ids.
#   brand_hex: per-provider brand anchor (#RRGGBB); `generic` has no vendor color.
#   resources: one entry per neutral resource_type; each carries, per provider,
#     a `label` (native service name), `aliases` (native-type strings a collector
#     may emit), and `icon` (id / name / hex) used to seed the offline icon
#     inventory. `generic` carries labels + aliases but no vendor icon.

version: 1

providers: [aws, azure, gcp, oci, generic]

brand_hex:
  aws: "#232F3E"      # AWS Squid Ink
  azure: "#0078D4"    # Azure blue
  gcp: "#4285F4"      # Google blue
  oci: "#F80000"      # Oracle red
  generic: "#FFFFFF"  # grayscale — no vendor color (white fill / black stroke)

resources:
  boundary:
    aws:
      label: Account
      aliases: [account, "aws::organizations::account", aws_account]
      icon: { id: mxgraph.aws4.group_account, name: AWS Account, hex: "#232F3E" }
    azure:
      label: Subscription
      aliases: [subscription, azurerm_subscription]
      icon: { id: azure.subscription, name: Azure Subscription, hex: "#0078D4" }
    gcp:
      label: Project
      aliases: [project, google_project, cloudresourcemanager.project]
      icon: { id: gcp.project, name: Google Cloud Project, hex: "#4285F4" }
    oci:
      label: Tenancy/Compartment
      aliases: [tenancy, compartment, oci_identity_compartment]
      icon: { id: oci.compartment, name: OCI Tenancy / Compartment, hex: "#F80000" }
    generic:
      label: Environment
      aliases: [environment, boundary]

  network_boundary:
