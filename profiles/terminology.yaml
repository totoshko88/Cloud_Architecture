    generic:
      label: WAF
      aliases: [waf, web_application_firewall]

  lb:
    aws:
      label: Elastic Load Balancing
      aliases: ["aws::elasticloadbalancingv2::loadbalancer", aws_lb, elbv2, load_balancer, lb]
    azure:
      label: Load Balancers
