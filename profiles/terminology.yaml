    gcp:
      label: Cloud Load Balancing
      aliases: ["compute.googleapis.com/forwardingrule", google_compute_forwarding_rule, forwarding_rule, load_balancing]
    oci:
      label: Load Balancer
      aliases: [oci_load_balancer, load_balancer, lb]
    generic:
      label: Load Balancer
      aliases: [lb, load_balancer]

  cache:
    aws:
      label: ElastiCache
      aliases: ["aws::elasticache::cachecluster", aws_elasticache_cluster, elasticache, cache_cluster]
    azure:
      label: Cache for Redis
      aliases: ["microsoft.cache/redis", azurerm_redis_cache, redis_cache]
    gcp:
      label: Memorystore
      aliases: ["redis.googleapis.com/instance", google_redis_instance, memorystore]
    oci:
      label: Cache
      aliases: [oci_redis_redis_cluster, redis_cluster, cache]
    generic:
      label: Cache
      aliases: [cache, in_memory_cache]
