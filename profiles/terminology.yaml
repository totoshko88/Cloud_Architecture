      label: Route 53
      aliases: ["aws::route53::hostedzone", aws_route53_zone, route53, hosted_zone]
    azure:
      label: DNS Zones
      aliases: ["microsoft.network/dnszones", azurerm_dns_zone, dns_zone]
    gcp:
      label: Cloud DNS
      aliases: ["dns.googleapis.com/managedzone", google_dns_managed_zone, managed_zone]
    oci:
      label: DNS
      aliases: [oci_dns_zone, dns_zone, dns]
    generic:
      label: DNS
      aliases: [dns]

  waf:
