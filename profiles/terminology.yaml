# Single source of truth for the neutral-concept -> per-provider terminology,
# native-type aliases, and seed icon metadata (REVIEW.md finding C1).
#
# This file is the authoritative machine-readable form of the terminology
# normalization table declared in `.kiro/steering/provider-profiles.md`. The
# core modules READ from it rather than each hard-coding its own copy:
#
#   - rule_engine.contract   -> native display `label` per provider
#   - rule_engine.normalizer -> native-type `aliases` -> neutral resource_type
#   - rule_engine.assets.enumerate -> seed `icon` (id / name / brand_hex)
#
# Adding a provider is therefore a data change here (plus the icon mapping YAML
# and a golden example), never a change to core Python. A CI test
# (tests/test_terminology_source.py) asserts every core module and the steering
# table agree with this file.
#
# Structure:
#   providers: ordered list of the five Provider Profile ids.
#   brand_hex: per-provider brand anchor (#RRGGBB); `generic` has no vendor color.
#   resources: one entry per neutral resource_type; each carries, per provider,
#     a `label` (native service name), `aliases` (native-type strings a collector
#     may emit), and `icon` (id / name / hex) used to seed the offline icon
#     inventory. `generic` carries labels + aliases but no vendor icon.

version: 1

providers: [aws, azure, gcp, oci, generic]

brand_hex:
  aws: "#232F3E"      # AWS Squid Ink
  azure: "#0078D4"    # Azure blue
  gcp: "#4285F4"      # Google blue
  oci: "#F80000"      # Oracle red
  generic: "#FFFFFF"  # grayscale — no vendor color (white fill / black stroke)

resources:
  boundary:
    aws:
      label: Account
      aliases: [account, "aws::organizations::account", aws_account]
      icon: { id: mxgraph.aws4.group_account, name: AWS Account, hex: "#232F3E" }
    azure:
      label: Subscription
      aliases: [subscription, azurerm_subscription]
      icon: { id: azure.subscription, name: Azure Subscription, hex: "#0078D4" }
    gcp:
      label: Project
      aliases: [project, google_project, cloudresourcemanager.project]
      icon: { id: gcp.project, name: Google Cloud Project, hex: "#4285F4" }
    oci:
      label: Tenancy/Compartment
      aliases: [tenancy, compartment, oci_identity_compartment]
      icon: { id: oci.compartment, name: OCI Tenancy / Compartment, hex: "#F80000" }
    generic:
      label: Environment
      aliases: [environment, boundary]

  network_boundary:
    aws:
      label: VPC
      aliases: [vpc, "aws::ec2::vpc", aws_vpc]
      icon: { id: mxgraph.aws4.group_vpc, name: Amazon VPC, hex: "#8C4FFF" }
    azure:
      label: VNet
      aliases: [vnet, virtualnetwork, virtual_network, azurerm_virtual_network]
      icon: { id: azure.virtual_network, name: Azure Virtual Network, hex: "#0078D4" }
    gcp:
      label: VPC
      aliases: [vpc, google_compute_network, compute.network]
      icon: { id: gcp.virtual_private_cloud, name: Google VPC, hex: "#4285F4" }
    oci:
      label: VCN
      aliases: [vcn, virtual_cloud_network, oci_core_vcn]
      icon: { id: oci.virtual_cloud_network, name: OCI VCN, hex: "#F80000" }
    generic:
      label: Network
      aliases: [network, network_boundary]

  serverless_fn:
    aws:
      label: Lambda
      aliases: [lambda, "aws::lambda::function", aws_lambda_function]
      icon: { id: mxgraph.aws4.lambda, name: AWS Lambda, hex: "#ED7100" }
    azure:
      label: Functions
      aliases: [functions, function_app, functionapp, azurerm_function_app]
      icon: { id: azure.function_apps, name: Azure Functions, hex: "#0062AD" }
    gcp:
      label: Cloud Functions
      aliases: [cloud_functions, cloudfunctions.function, google_cloudfunctions_function]
      icon: { id: gcp.cloud_functions, name: Cloud Functions, hex: "#4285F4" }
    oci:
      label: Functions
      aliases: [functions, oci_functions_function, fnfunction]
      icon: { id: oci.functions, name: OCI Functions, hex: "#F80000" }
    generic:
      label: Function
      aliases: [function, serverless_fn]

  object_store:
    aws:
      label: S3
      aliases: [s3, "aws::s3::bucket", aws_s3_bucket, bucket]
      icon: { id: mxgraph.aws4.s3, name: Amazon S3, hex: "#7AA116" }
    azure:
      label: Blob Storage
      aliases: [blob_storage, blobstorage, storage_account, storageaccount, azurerm_storage_account]
      icon: { id: azure.storage_accounts, name: Azure Blob Storage, hex: "#0078D4" }
    gcp:
      label: Cloud Storage
      aliases: [cloud_storage, storage.bucket, google_storage_bucket, gcs]
      icon: { id: gcp.cloud_storage, name: Cloud Storage, hex: "#4285F4" }
    oci:
      label: Object Storage
      aliases: [object_storage, oci_objectstorage_bucket, bucket]
      icon: { id: oci.object_storage, name: OCI Object Storage, hex: "#F80000" }
    generic:
      label: Object Store
      aliases: [object_store]

  managed_sql:
    aws:
      label: RDS
      aliases: [rds, "aws::rds::dbinstance", aws_db_instance, db_instance]
      icon: { id: mxgraph.aws4.rds, name: Amazon RDS, hex: "#527FFF" }
    azure:
      label: Azure SQL DB
