  secrets_store:
    aws:
      label: Secrets Manager
      aliases: [secrets_manager, "aws::secretsmanager::secret", aws_secretsmanager_secret]
      icon: { id: mxgraph.aws4.secrets_manager, name: AWS Secrets Manager, hex: "#DD344C" }
    azure:
      label: Key Vault
      aliases: [key_vault, keyvault, azurerm_key_vault]
      icon: { id: azure.key_vaults, name: Azure Key Vault, hex: "#0078D4" }
    gcp:
      label: Secret Manager
      aliases: [secret_manager, secretmanager.secret, google_secret_manager_secret]
      icon: { id: gcp.secret_manager, name: Secret Manager, hex: "#4285F4" }
    oci:
      label: Vault
      aliases: [vault, oci_kms_vault]
      icon: { id: oci.vault, name: OCI Vault, hex: "#F80000" }
    generic:
      label: Secrets Store
      aliases: [secrets_store]

  managed_k8s:
    aws:
      label: EKS
      aliases: [eks, "aws::eks::cluster", aws_eks_cluster]
      icon: { id: mxgraph.aws4.eks, name: Amazon EKS, hex: "#ED7100" }
    azure:
      label: AKS
      aliases: [aks, kubernetes_service, azurerm_kubernetes_cluster]
      icon: { id: azure.kubernetes_services, name: Azure Kubernetes Service, hex: "#0078D4" }
    gcp:
