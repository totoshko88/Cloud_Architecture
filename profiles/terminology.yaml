      icon: { id: gcp.cloud_sql, name: Cloud SQL, hex: "#4285F4" }
    oci:
      label: Autonomous/DB Systems
      aliases: [autonomous_database, db_system, dbsystem, oci_database_autonomous_database]
      icon: { id: oci.autonomous_database, name: OCI Autonomous Database, hex: "#F80000" }
    generic:
      label: Managed SQL
