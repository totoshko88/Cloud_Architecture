      label: OCI Generative AI
      aliases: [generative_ai, genai, oci_generative_ai]
      icon: { id: oci.generative_ai, name: OCI Generative AI, hex: "#F80000" }
    generic:
      label: LLM Platform
      aliases: [llm_platform]

  # --- diagram presentation roles (1.7.0, design D4) -----------------------
  # The seven roles below are not first-class inventory types like the nine
  # above; they are how a distinct service is *drawn* (its icon), declared as
  # roles in mappings/roles.yaml. They gain a terminology row here so a
  # collector can normalize a native type back to the role. They carry native
  # labels + aliases per provider (aws/azure/gcp/oci) and a generic label;
  # icons resolve through mappings/roles.yaml -> mappings/icon-index.json, so
  # no per-row `icon` block is needed.

  compute_instance:
    aws:
      label: EC2
      aliases: ["aws::ec2::instance", aws_instance, ec2, instance]
    azure:
      label: Virtual Machines
      aliases: ["microsoft.compute/virtualmachines", virtual_machine, azurerm_virtual_machine, vm]
    gcp:
      label: Compute Engine
      aliases: ["compute.googleapis.com/instance", google_compute_instance, compute_instance]
    oci:
      label: Compute
      aliases: [oci_core_instance, instance]
    generic:
      label: Compute Instance
      aliases: [compute_instance, vm]

  file_system:
    aws:
      label: EFS
      aliases: ["aws::efs::filesystem", "aws::fsx::filesystem", aws_efs_file_system, efs, fsx]
    azure:
      label: Azure Files
      aliases: ["microsoft.storage/storageaccounts/fileservices", azure_files, file_share]
    gcp:
      label: Filestore
      aliases: ["file.googleapis.com/instance", google_filestore_instance, filestore]
    oci:
      label: File Storage
      aliases: [oci_file_storage_file_system, file_storage, file_system]
    generic:
      label: File System
      aliases: [file_system, nfs]

  cdn:
