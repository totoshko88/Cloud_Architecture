# Azure icon mapping table for the Rule Engine Icon Resolver.
#
# Maps each of the 9 neutral resource types to an icon id, a brand hex color
# (#RRGGBB), and a complete draw.io style string that references the custom
# Azure shape library imported from the unpacked Azure V24 icon assets.
# Also declares exactly one Boundary and one Network Boundary container style
# (Requirement 2 AC6). Brand anchor: Azure #0078D4.
#
# icon_source is `custom`: Azure icons are imported as a custom draw.io shape
# library from unpacked assets (design section 4b) rather than a built-in
# library. Every icon id and brand hex is sourced from the authoritative asset
# pack declared below (Requirement 2 AC9).
provider: azure
asset_pack: "Azure Architecture Icons V24 (custom draw.io shape library, unpacked)"
icon_source: custom
resources:
  boundary:
    icon_id: azure.subscription
    brand_hex: "#0078D4"
    style: "shape=mxgraph.azure.subscription;fillColor=#0078D4;strokeColor=#ffffff;aspect=fixed;html=1;fontSize=11;verticalLabelPosition=bottom;verticalAlign=top;align=center"
  network_boundary:
    icon_id: azure.virtual_network
    brand_hex: "#0078D4"
    style: "shape=mxgraph.azure.virtual_network;fillColor=#0078D4;strokeColor=#ffffff;aspect=fixed;html=1;fontSize=11;verticalLabelPosition=bottom;verticalAlign=top;align=center"
  serverless_fn:
    icon_id: azure.function_apps
    brand_hex: "#0062AD"
    style: "shape=mxgraph.azure.function_apps;fillColor=#0062AD;strokeColor=#ffffff;aspect=fixed;html=1;fontSize=11;verticalLabelPosition=bottom;verticalAlign=top;align=center"
  object_store:
    icon_id: azure.storage_accounts
    brand_hex: "#0078D4"
    style: "shape=mxgraph.azure.storage_accounts;fillColor=#0078D4;strokeColor=#ffffff;aspect=fixed;html=1;fontSize=11;verticalLabelPosition=bottom;verticalAlign=top;align=center"
  managed_sql:
    icon_id: azure.sql_database
    brand_hex: "#0078D4"
    style: "shape=mxgraph.azure.sql_database;fillColor=#0078D4;strokeColor=#ffffff;aspect=fixed;html=1;fontSize=11;verticalLabelPosition=bottom;verticalAlign=top;align=center"
  message_queue:
    icon_id: azure.service_bus
    brand_hex: "#0078D4"
    style: "shape=mxgraph.azure.service_bus;fillColor=#0078D4;strokeColor=#ffffff;aspect=fixed;html=1;fontSize=11;verticalLabelPosition=bottom;verticalAlign=top;align=center"
  secrets_store:
    icon_id: azure.key_vaults
    brand_hex: "#0078D4"
    style: "shape=mxgraph.azure.key_vaults;fillColor=#0078D4;strokeColor=#ffffff;aspect=fixed;html=1;fontSize=11;verticalLabelPosition=bottom;verticalAlign=top;align=center"
  managed_k8s:
    icon_id: azure.kubernetes_services
    brand_hex: "#0078D4"
    style: "shape=mxgraph.azure.kubernetes_services;fillColor=#0078D4;strokeColor=#ffffff;aspect=fixed;html=1;fontSize=11;verticalLabelPosition=bottom;verticalAlign=top;align=center"
  llm_platform:
    icon_id: azure.cognitive_services
    brand_hex: "#0078D4"
    style: "shape=mxgraph.azure.cognitive_services;fillColor=#0078D4;strokeColor=#ffffff;aspect=fixed;html=1;fontSize=11;verticalLabelPosition=bottom;verticalAlign=top;align=center"
containers:
  boundary:
    icon_id: azure.subscription
    brand_hex: "#0078D4"
    style: "rounded=0;whiteSpace=wrap;html=1;dashed=1;dashPattern=8 4;strokeColor=#0078D4;fillColor=none;verticalAlign=top;fontColor=#0078D4;fontSize=12"
  network_boundary:
    icon_id: azure.virtual_network
    brand_hex: "#0078D4"
    style: "rounded=0;whiteSpace=wrap;html=1;dashed=1;dashPattern=8 4;strokeColor=#0062AD;fillColor=none;verticalAlign=top;fontColor=#0062AD;fontSize=12"
