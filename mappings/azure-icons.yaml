# Azure icon mapping table for the Rule Engine Icon Resolver.
#
# Maps each of the 9 neutral resource types to an icon id, a brand hex color
# (#RRGGBB), and a complete draw.io style string. Azure service icons use the
# official built-in draw.io "azure2" image shapes (image=img/lib/azure2/...),
# which are the current Azure icon set. The older `mxgraph.azure.*` stencil
# library covered only a handful of legacy services (Instance, Cloud Service,
# etc.) and rendered most modern services as empty boxes; azure2 image shapes
# resolve for every service below. Verified against the draw.io sources
# (js/diagramly/sidebar/Sidebar-Azure2.js). Also declares exactly one Boundary
# and one Network Boundary container style (Requirement 2 AC6). Brand anchor:
# Azure #0078D4.
#
# icon_source is `custom`: the azure2 images ship with draw.io but are image
# shapes, not an mxgraph stencil library. Every path is sourced from the
# authoritative draw.io azure2 asset set (Requirement 2 AC9).
provider: azure
asset_pack: "draw.io built-in azure2 image shapes (img/lib/azure2, current Azure icon set)"
icon_source: custom
resources:
  boundary:
    icon_id: azure2.subscriptions
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/general/Subscriptions.svg"
  network_boundary:
    icon_id: azure2.virtual_networks
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/networking/Virtual_Networks.svg"
  serverless_fn:
    icon_id: azure2.function_apps
    brand_hex: "#0062AD"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/compute/Function_Apps.svg"
  object_store:
    icon_id: azure2.storage_accounts
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/storage/Storage_Accounts.svg"
  managed_sql:
    icon_id: azure2.sql_database
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/databases/SQL_Database.svg"
  message_queue:
    icon_id: azure2.service_bus
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/general/Service_Bus.svg"
  secrets_store:
    icon_id: azure2.key_vaults
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/security/Key_Vaults.svg"
  managed_k8s:
    icon_id: azure2.kubernetes_services
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/compute/Kubernetes_Services.svg"
  llm_platform:
    icon_id: azure2.azure_openai
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/ai_machine_learning/Azure_OpenAI.svg"

containers:
  boundary:
    icon_id: azure.subscription
    brand_hex: "#0078D4"
    style: "rounded=0;whiteSpace=wrap;html=1;dashed=1;dashPattern=8 4;strokeColor=#0078D4;fillColor=none;verticalAlign=top;fontColor=#0078D4;fontSize=12"
  network_boundary:
    icon_id: azure.virtual_network
    brand_hex: "#0078D4"
    style: "rounded=0;whiteSpace=wrap;html=1;dashed=1;dashPattern=8 4;strokeColor=#0062AD;fillColor=none;verticalAlign=top;fontColor=#0062AD;fontSize=12"
