# GCP icon mapping table for the Rule Engine Icon Resolver.
#
# Icon source priority (highest first), per the maintainer decision:
#   1. Official Core Product icons  (core-products-icons.zip -> gcp-core) — a
#      service's own unique 2025 icon. Used when the neutral type maps to a
#      flagship product Google ships a dedicated icon for.
#   2. Official Product Category icons (category-icons.zip -> gcp-category) — the
#      general category glyph, used when no dedicated product icon exists (Google
#      deliberately represents non-flagship services by their category since the
#      early-2025 iconography update).
#   3. Built-in draw.io `mxgraph.gcp2.*` stencils — only as a last resort when no
#      official asset exists. NOTE: contrary to an earlier claim, gcp2 is NOT
#      "9 structural shapes only": it defines 255 shapes incl. per-service icons
#      (verified against the draw.io app.asar). It is a pre-2025 style, so it is
#      the fallback, not the default, to avoid mixing icon eras.
#
# All nine neutral types are covered by tiers 1–2, so no gcp2 fallback is needed
# here. Four types resolve to a dedicated product icon; five to a category icon.
# Both official packs are referenced by file path under the git-ignored asset
# root that scripts/fetch_assets.py produces (image=assets/vendor/gcp-...), the
# same file-path image-shape approach used for Azure (azure2). Brand anchor: GCP #4285F4.
#
# icon_source is `custom`: the icons come from the official packs fetched on demand,
# referenced by file path, not from a built-in draw.io library. Every path is
# sourced from a pack declared in mappings/asset-sources.yaml (Requirement 2 AC9).
provider: gcp
asset_pack: "Google Cloud official icons — Core Product (core-products-icons.zip -> gcp-core) with Product Category fallback (category-icons.zip -> gcp-category)"
icon_source: custom
