# GCP icon mapping table for the Rule Engine Icon Resolver.
#
# Icon source priority (highest first), per the maintainer decision:
#   1. Official Core Product icons  (core-products-icons.zip -> gcp-core) — a
#      service's own unique 2025 icon. Used when the neutral type maps to a
#      flagship product Google ships a dedicated icon for.
#   2. Official Product Category icons (category-icons.zip -> gcp-category) — the
#      general category glyph, used when no dedicated product icon exists (Google
#      deliberately represents non-flagship services by their category since the
#      early-2025 iconography update).
#   3. Built-in draw.io `mxgraph.gcp2.*` stencils — only as a last resort when no
#      official asset exists. NOTE: contrary to an earlier claim, gcp2 is NOT
#      "9 structural shapes only": it defines 255 shapes incl. per-service icons
#      (verified against the draw.io app.asar). It is a pre-2025 style, so it is
#      the fallback, not the default, to avoid mixing icon eras.
#
# All nine neutral types are covered by tiers 1–2, so no gcp2 fallback is needed
# here. Four types resolve to a dedicated product icon; five to a category icon.
# Both official packs are referenced by file path under the git-ignored asset
# root that scripts/fetch_assets.py produces (image=assets/vendor/gcp-...), the
# same file-path image-shape approach used for Azure (azure2). Brand anchor: GCP #4285F4.
#
# icon_source is `custom`: the icons come from the official packs fetched on demand,
# referenced by file path, not from a built-in draw.io library. Every path is
# sourced from a pack declared in mappings/asset-sources.yaml (Requirement 2 AC9).
provider: gcp
asset_pack: "Google Cloud official icons — Core Product (core-products-icons.zip -> gcp-core) with Product Category fallback (category-icons.zip -> gcp-category)"
icon_source: custom
resources:
  boundary:
    icon_id: gcp-category.boundary
    icon_provenance: category
    brand_hex: "#4285F4"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/gcp-category/Category Icons/Management Tools/SVG/ManagementTools-512-color.svg"
  network_boundary:
    icon_id: gcp-category.network_boundary
    icon_provenance: category
    brand_hex: "#4285F4"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/gcp-category/Category Icons/Networking/SVG/Networking-512-color-rgb.svg"
  serverless_fn:
    icon_id: gcp-category.serverless_fn
    icon_provenance: category
    brand_hex: "#4285F4"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/gcp-category/Category Icons/Serverless Computing/SVG/ServerlessComputing-512-color.svg"
  object_store:
    icon_id: gcp-core.cloud_storage
    icon_provenance: product
    brand_hex: "#4285F4"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/gcp-core/Unique Icons/Cloud Storage/SVG/Cloud_Storage-512-color.svg"
  managed_sql:
    icon_id: gcp-core.cloud_sql
    icon_provenance: product
    brand_hex: "#4285F4"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/gcp-core/Unique Icons/Cloud SQL/SVG/CloudSQL-512-color.svg"
  message_queue:
    icon_id: gcp-category.message_queue
    icon_provenance: category
    brand_hex: "#4285F4"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/gcp-category/Category Icons/Integration Services/SVG/IntegrationServices-512-color.svg"
  secrets_store:
    icon_id: gcp-category.secrets_store
    icon_provenance: category
    brand_hex: "#4285F4"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/gcp-category/Category Icons/Security Identity/SVG/SecurityIdentity-512-color.svg"
  managed_k8s:
    icon_id: gcp-core.gke
    icon_provenance: product
    brand_hex: "#4285F4"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/gcp-core/Unique Icons/GKE/SVG/GKE-512-color.svg"
  llm_platform:
    icon_id: gcp-core.vertex_ai
    icon_provenance: product
    brand_hex: "#4285F4"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/gcp-core/Unique Icons/Vertex AI/SVG/VertexAI-512-color.svg"

  # --- External / third-party systems (Theme 1) ---
  external_system:
    icon_id: external.system
    icon_provenance: neutral
    brand_hex: "#333333"
    style: "rounded=1;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#333333;dashed=1;verticalAlign=middle;fontSize=12"
  # MongoDB Atlas — identification-use neutral box in MongoDB green; leaf mark not redistributed.
  mongodb_atlas:
    icon_id: mongodb.atlas
    icon_provenance: neutral
    brand_hex: "#13AA52"
    # 1.10.11 (Opt 2): the real MongoDB leaf silhouette, colorized to brand green
    # at fetch time into the git-ignored assets/vendor/opensource-colorized and
    # referenced by file path — the mark is identification use, never committed.
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/opensource-colorized/mongodb.svg"
  # Open-source brand leaves (feedback Theme 35) — colorized Simple Icons, same
  # path as mongodb_atlas; resolve once --update-pins populates the dir.
  keycloak:
    icon_id: keycloak
    icon_provenance: neutral
    brand_hex: "#4D4D4D"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/opensource-colorized/keycloak.svg"
  redis:
    icon_id: redis
    icon_provenance: neutral
    brand_hex: "#FF4438"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/opensource-colorized/redis.svg"
  postgresql:
    icon_id: postgresql
    icon_provenance: neutral
    brand_hex: "#4169E1"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/opensource-colorized/postgresql.svg"
  # Fleet of N (Theme 22) — stacked-box glyph for a count of like resources.
  fleet:
    icon_id: fleet.stack
    icon_provenance: neutral
    brand_hex: "#333333"
    style: "shape=mxgraph.flowchart.multiple_documents;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#333333;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12"
  # Peer account / peer cloud AS A NODE (feedback Theme 34). The GCP pack ships
  # no high-level project/organization glyph, so a peer-cloud node keeps the
  # neutral external box — Icon Fidelity forbids substituting a look-alike where
  # the real asset is absent. (AWS/Azure resolve these to their own org glyph.)
  peer_account:
    icon_id: external.system
    icon_provenance: neutral
    brand_hex: "#333333"
    style: "rounded=1;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#333333;dashed=1;verticalAlign=middle;fontSize=12"
  external_cloud:
    icon_id: external.system
    icon_provenance: neutral
    brand_hex: "#333333"
    style: "rounded=1;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#333333;dashed=1;verticalAlign=middle;fontSize=12"
  # Education / learning system (1.10.12) — the provider-neutral CC0
  # mortarboard bundled with the engine (see aws-icons.yaml `education`).
  education:
    icon_id: education.mortarboard
    icon_provenance: neutral
    brand_hex: "#333333"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/education/mortarboard.svg"

