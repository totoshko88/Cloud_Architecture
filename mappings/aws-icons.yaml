# AWS icon mapping table for the Diagram & Inventory Rule Engine.
#
# MIGRATION 1.10.2: AWS icons now use official SVG file paths (like Azure/GCP),
# not mxgraph.aws4 stencils. This provides:
#   - Exact colors as designed by AWS (no fillColor/strokeColor guessing)
#   - Clear Service vs Resource icon distinction (Arch_* vs Res_*)
#   - Consistent approach across all providers
#   - Easier updates when AWS releases new icon packs
#
# Icon types:
#   - Architecture Service Icons (Arch_*_48.svg) — service-level icons with
#     category-colored backgrounds (orange compute, green storage, etc.)
#   - Resource Icons (Res_*_48.svg) — instance/resource-level icons with white
#     backgrounds and colored outlines
#
# All paths are relative to the git-ignored asset root (assets/vendor/aws-icons).
# The pack is fetched by scripts/fetch_assets.py from asset-sources.yaml.
#
# Requirements: 2.3, 2.4, 2.6, 2.9, 9.3
provider: aws
asset_pack: "AWS Architecture Icons (official SVG pack, July 2026)"
icon_source: custom

resources:
