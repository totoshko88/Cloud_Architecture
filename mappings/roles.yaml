# Diagram presentation roles → per-provider service query.
#
# A "role" is how a NODE is shown in a diagram (its icon), which is a superset of
# the nine neutral *resource types* in schemas/inventory.schema.json. The neutral
# types cover the inventory/normalizer contract; diagram generators additionally
# need presentation-only roles (cdn, dns, waf, cache, …) that map to a distinct
# vendor icon but are not first-class inventory types.
#
# RULE (see .kiro/steering/diagram-standards.md — "One role per distinct
# service"): a service that is semantically different from an existing role gets
# its OWN role with a per-provider icon — never a look-alike. A CDN is not an
# object store; a DNS is not a load balancer; a WAF is not a generic secrets
# store. This file is the single source of truth for that role → service mapping;
# scripts/build_icon_sets.py resolves each query against the indexed official
# packs and writes the resolved icon into the committed mappings/icon-index.json.
#
# For each role, per provider, `query` is the service name resolved against that
# provider's official pack index (asset_index.resolve_asset). For GCP a role may
# also declare `gcp_category` — the Google docs category whose icon stands in when
# the service has no dedicated 2025 product icon (product-first, category-fallback;
# this is Google's own convention, e.g. Cloud CDN → Networking category icon).
version: 1

roles:

  # --- container roles (rendered as group/boundary styles, not node icons) --
  # boundary and network_boundary are drawn as dashed container frames (see each
  # mappings/<provider>-icons.yaml `containers:` block), not as node image icons.
  # Their entries here resolve the *representative* group glyph for reference.
  boundary:
    aws: "Account"
    azure: "Subscriptions"
    gcp_category: "Management Tools"
    oci: "compartments"
  network_boundary:
    aws: "Virtual Private Cloud"
    azure: "Virtual Networks"
    gcp_category: "Networking"
    oci: "virtual-cloud-network-vcn"
  serverless_fn:
    aws: "Lambda"
    azure: "Function Apps"
    gcp_category: "Serverless Computing"
    oci: "functions"
  object_store:
    aws: "Simple Storage Service"
    azure: "Storage Accounts"
    gcp: "Cloud Storage"
    oci: "object-storage"
  managed_sql:
    aws: "RDS"
    azure: "SQL Database"
    gcp: "Cloud SQL"
    oci: "autonomous-db"
  message_queue:
    aws: "Simple Queue Service"
    azure: "Service Bus"
    gcp_category: "Integration Services"
    oci: "streaming"
  secrets_store:
    aws: "Secrets Manager"
    azure: "Key Vaults"
    gcp_category: "Security Identity"
    oci: "vault"
  managed_k8s:
    aws: "Elastic Kubernetes Service"
    azure: "Kubernetes Services"
    gcp: "GKE"
    oci: "container-engine-for-kubernetes"
  llm_platform:
    aws: "Bedrock"
    azure: "Azure OpenAI"
    gcp: "Vertex AI"
    oci: "artificial-intelligence"

  # --- presentation-only roles (distinct icon, not an inventory type) -------
  # CDN: AWS CloudFront, Azure CDN Profiles, GCP → Networking category (Google's
  # own convention: Cloud CDN has no product glyph), OCI CDN stencil.
  cdn:
    aws: "CloudFront"
    azure: "CDN Profiles"
    gcp_category: "Networking"
    oci: "cdn"
  # DNS / traffic routing.
  dns:
    aws: "Route 53"
    azure: "DNS Zones"
    gcp_category: "Networking"
    oci: "dns"
  # Web Application Firewall.
  waf:
    aws: "WAF"
    azure: "Web Application Firewall Policies WAF"
    gcp_category: "Security Identity"
    oci: "waf"
  # Load balancer.
  lb:
    aws: "Elastic Load Balancing"
    azure: "Load Balancers"
    gcp_category: "Networking"
    oci: "load-balancer"
  # In-memory cache. OCI has no dedicated cache glyph → falls back to its
  # database family; recorded as a gap for OCI.
  cache:
    aws: "ElastiCache"
    azure: "Cache Redis"
    gcp_category: "Databases"
    oci: "autonomous-db"
  # Virtual machine / compute instance (EC2 and peers). Compute family, distinct
  # from serverless_fn — a VM is not a function. Orange compute family on AWS.
  compute_instance:
    aws: "EC2"
    azure: "Virtual Machines"
    gcp_category: "Compute"
    oci: "compute"
  # Managed elastic file system / shared NFS. Storage family (green on AWS) —
  # distinct from object_store: a mountable filesystem is not a bucket.
  file_system:
    aws: "Elastic File System"
    azure: "Azure Files"
    gcp_category: "Storage"
    oci: "file-storage"

  # --- additional AWS services (commonly used in architecture diagrams) ------
  # These extend beyond the core presentation roles to cover services that appear
  # frequently in real-world diagrams. The query string matches the official AWS
  # icon pack's Arch_<Service> naming. Each service has its own icon — never
  # substitute a look-alike (diagram-standards.md "Icon Fidelity").

  # AWS Systems Manager — Management & Governance family (pink)
  ssm:
    aws: "Systems Manager"
    azure: "Automation Accounts"
    gcp_category: "Management Tools"
    oci: "resource-manager"

  # Amazon Aurora — Database family (blue)
  aurora:
    aws: "Aurora"
    azure: "Azure Database MySQL Server"
    gcp: "Cloud SQL"
    oci: "autonomous-db"

  # Amazon DynamoDB — Database family (blue)
  dynamodb:
    aws: "DynamoDB"
    azure: "Cosmos DB"
    gcp_category: "Databases"
    oci: "nosql"

  # AWS Identity and Access Management — Security family (red)
  iam:
    aws: "Identity and Access Management"
    azure: "Entra ID"
    gcp_category: "Security Identity"
    oci: "identity-and-access-management"

  # Amazon Simple Notification Service — Application Integration (pink)
  sns:
    aws: "Simple Notification Service"
    azure: "Notification Hubs"
    gcp_category: "Integration Services"
    oci: "notifications"

  # AWS Step Functions — Application Integration (pink)
  step_functions:
    aws: "Step Functions"
    azure: "Logic Apps"
    gcp_category: "Integration Services"
    oci: "resource-manager"

  # Amazon EventBridge — Application Integration (pink)
  eventbridge:
    aws: "EventBridge"
    azure: "Event Grid"
    gcp_category: "Integration Services"
    oci: "events"

  # Amazon API Gateway — Networking & Content Delivery (purple)
  api_gateway:
    aws: "API Gateway"
    azure: "API Management"
    gcp: "Apigee"
    oci: "api-gateway"

  # Amazon Cognito — Security family (red)
  cognito:
    aws: "Cognito"
    azure: "Entra ID"
    gcp_category: "Security Identity"
    oci: "identity-and-access-management"

  # Amazon CloudWatch — Management & Governance family (pink)
  cloudwatch:
    aws: "CloudWatch"
    azure: "Monitor"
    gcp_category: "Management Tools"
    oci: "monitoring"

  # Amazon Bedrock AgentCore — AI/ML family (green)
  bedrock_agentcore:
    aws: "Bedrock AgentCore"
    azure: "Azure OpenAI"
    gcp: "Vertex AI"
    oci: "artificial-intelligence"

  # --- Resource-level icons (specific instances, not services) ---------------
  # These are for when you need to show a specific RESOURCE (like a bucket) vs
  # the SERVICE (like S3). Resource icons come from Res_* in the AWS pack.

  # S3 Bucket — a specific storage bucket, not the S3 service itself
  s3_bucket:
    aws: "Simple Storage Service Bucket"
    azure: "Storage Accounts"
    gcp: "Cloud Storage"
    oci: "bucket"

  # S3 Bucket with objects — shows bucket contains data
  s3_bucket_with_objects:
    aws: "Simple Storage Service Bucket With Objects"
    azure: "Storage Accounts"
    gcp: "Cloud Storage"
    oci: "bucket"

  # Lambda Function — a specific function, not the Lambda service
  lambda_function:
    aws: "Lambda Lambda Function"
    azure: "Function Apps"
    gcp_category: "Serverless Computing"
    oci: "functions"

  # EC2 Instance — a specific VM instance
  ec2_instance:
    aws: "EC2 Instance"
    azure: "Virtual Machines"
    gcp_category: "Compute"
    oci: "virtual-machine-vm"

  # RDS DB Instance — a specific database instance
  rds_instance:
    aws: "Aurora Amazon RDS Instance"
    azure: "SQL Database"
    gcp: "Cloud SQL"
    oci: "autonomous-db"

  # --- Compute / registry services (Theme 5) ---------------------------------
  # AWS Batch — managed batch compute. Compute family (orange). VPC-scoped
  # (jobs run on compute in a subnet).
  batch:
    aws: "Batch"
    azure: "Batch Accounts"
    gcp_category: "Compute"
    oci: "compute"

  # Elastic Container Registry — managed container image registry. Containers
  # family. Regional service reached over endpoints.
  ecr:
    aws: "Elastic Container Registry"
    azure: "Container Registries"
    gcp_category: "Containers"
    oci: "registry"

  # --- Network resource icons (Theme 15) -------------------------------------
  # First-class network-plumbing roles so a connectivity diagram no longer has
  # to hand-draw grey boxes. AWS uses the Resource-Icons (Res_*) set; the brand
  # colour is the Networking family purple (#8C4FFF). All are VPC-scoped (they
  # live inside the Network Boundary) — see ROLE_SCOPE in layout/base.py.

  # The VPC itself as a node marker (distinct from the network_boundary CONTAINER
  # frame — this is the small VPC glyph used when a VPC is referenced as a node).
  vpc:
    aws: "Virtual Private Cloud"
    azure: "Virtual Networks"
    gcp_category: "Networking"
    oci: "virtual-cloud-network-vcn"

  # NAT Gateway — outbound-only egress for private subnets.
  nat_gateway:
    aws: "VPC NAT Gateway"
    azure: "NAT"
    gcp_category: "Networking"
    oci: "nat-gateway"

  # Internet Gateway — the VPC's attachment to the public internet.
  internet_gateway:
    aws: "VPC Internet Gateway"
    azure: "Virtual Networks"
    gcp_category: "Networking"
    oci: "internet-gateway"

  # VPC Endpoint — PrivateLink/interface or gateway endpoint to a regional
  # service without traversing the public internet.
  vpc_endpoint:
    aws: "VPC Endpoints"
    azure: "Private Link"
    gcp_category: "Networking"
    oci: "service-gateway"

  # VPC Peering Connection — a direct network link between two VPCs.
  vpc_peering:
    aws: "VPC Peering Connection"
    azure: "Virtual Networks"
    gcp_category: "Networking"
    oci: "remote-peering-gateway"
  # --- WS6 network diagram-type roles (1.11.0) -------------------------------
  # Extended roles for the `network` diagram type (TGW, VPN GW, DX, route table,
  # network firewall). EXTENDED roles only — the 16-value core invariant holds.
  transit_gateway:
    aws: "Transit Gateway"
    azure: "Virtual WANs"
    gcp_category: "Networking"
    oci: "dynamic-routing-gateway-drg"
  vpn_gateway:
    aws: "VPC VPN Gateway"
    azure: "Virtual Network Gateways"
    gcp_category: "Networking"
    oci: "special-connectors-site-to-site-vpn-vertical"
  direct_connect:
    aws: "Direct Connect"
    azure: "ExpressRoute Circuits"
    gcp_category: "Networking"
    oci: "special-connectors-fastconnect-vertical"
  route_table:
    aws: "Route Table"
    azure: "Route Tables"
    gcp_category: "Networking"
    oci: "route-table"
  network_firewall:
    aws: "Network Firewall"
    azure: "Firewalls"
    gcp_category: "Security Identity"
    oci: "firewall"
  # --- 1.11.0 WS7 access diagram type (principal / policy / resource) --------
  # Identity/IAM across the four providers. Extended roles only (the 16-value
  # core invariant holds). GCP falls back to the Security Identity category.
  principal:
    aws: "IAM Role"
    azure: "Managed Identities"
    gcp_category: "Security Identity"
    oci: "user"
  policy:
    aws: "Permissions"
    azure: "Policy"
    gcp_category: "Security Identity"
    oci: "iam-identity-and-access-management"
  resource:
    aws: "Generic Application"
    azure: "All Resources"
    gcp_category: "Security Identity"
    oci: "resource-manager"
  # --- WS9 icon-coverage fill-in (1.11.0) ------------------------------------
  # Common services that had an official icon in every indexed pack but no role,
  # so the render path raised DrawError. Each is an EXTENDED role (the 16-value
  # core invariant is untouched). Queries resolve against each provider's pack;
  # a provider with no distinct glyph falls back to its category (GCP) or the
  # closest family stencil (OCI), never a look-alike.

  # AWS CloudTrail — Management & Governance (pink)
  cloudtrail:
    aws: "CloudTrail"
    azure: "Monitor"
    gcp_category: "Management Tools"
    oci: "auditing"
  # AWS Config — Management & Governance (pink)
  config:
    aws: "Config"
    azure: "Policy"
    gcp_category: "Management Tools"
    oci: "resource-manager"
  # Amazon ECS — Containers (orange)
  ecs:
    aws: "Elastic Container Service"
    azure: "Container Instances"
    gcp_category: "Containers"
    oci: "container-engine-for-kubernetes"
  # AWS Fargate — Containers (orange)
  fargate:
    aws: "Fargate"
    azure: "Container Instances"
    gcp_category: "Containers"
    oci: "container-engine-for-kubernetes"
  # AWS KMS — Security & Identity (red)
  kms:
    aws: "Key Management Service"
    azure: "Key Vaults"
    gcp_category: "Security Identity"
    oci: "vault"
  # Amazon GuardDuty — Security & Identity (red)
  guardduty:
    aws: "GuardDuty"
    azure: "Defender"
    gcp_category: "Security Identity"
    oci: "cloud-guard"
  # Amazon Kinesis — Analytics (purple)
  kinesis:
    aws: "Kinesis"
    azure: "Event Hubs"
    gcp_category: "Data Analytics"
    oci: "streaming"
  # Amazon Athena — Analytics (purple)
  athena:
    aws: "Athena"
    azure: "Synapse Analytics"
    gcp_category: "Data Analytics"
    oci: "data-flow"
  # AWS Glue — Analytics (purple)
  glue:
    aws: "Glue"
    gcp_category: "Data Analytics"
    oci: "data-integration"
  # Amazon SageMaker AI — AI/ML (teal)
  sagemaker:
    aws: "SageMaker AI"
    azure: "Machine Learning"
    gcp: "Vertex AI"
    oci: "data-science"
  # Application Gateway (Azure) / L7 app gateway — Networking
  app_gateway:
    aws: "Elastic Load Balancing"
    azure: "Application Gateways"
    gcp_category: "Networking"
    oci: "flexible-load-balancer"
  # PaaS app host (Azure App Service and peers) — web/app tier
  app_service:
    aws: "Elastic Beanstalk"
    azure: "App Services"
    gcp_category: "Serverless Computing"
    oci: "functions"
  # Bastion / secure admin jump host — Security & Identity
  bastion:
    aws: "EC2"
    azure: "Bastions"
    gcp_category: "Security Identity"
    oci: "bastion"
  # Firewall / network firewall — Networking
  firewall:
    aws: "Network Firewall"
    azure: "Firewalls"
    gcp_category: "Networking"
    oci: "waf"
  # Managed log analytics workspace — Observability
  log_analytics:
    aws: "CloudWatch"
    azure: "Log Analytics Workspaces"
    gcp_category: "Management Tools"
    oci: "logging-analytics"
  # Container apps / serverless containers — Containers
  container_apps:
    aws: "Fargate"
    azure: "Container App Environments"
    gcp_category: "Serverless Computing"
    oci: "container"
  # Cognitive / AI services (vision, speech, language) — AI/ML
  cognitive_services:
    aws: "SageMaker AI"
    azure: "Cognitive Services"
    gcp_category: "AI _ Machine Learning"
    oci: "artificial-intelligence"
  # Managed MySQL (OCI MySQL HeatWave and peers) — Databases
  managed_mysql:
    aws: "RDS"
    azure: "Azure Database MySQL Server"
    gcp: "Cloud SQL"
    oci: "mysql"
  # Load balancer resource node (OCI flexible LB; distinct from the lb role so a
  # connectivity view can place an LB appliance explicitly) — Networking
  load_balancer:
    aws: "Elastic Load Balancing"
    azure: "Load Balancers"
    gcp_category: "Networking"
    oci: "flexible-load-balancer"
  # Compute node alias (OCI Compute) — Compute family
  compute:
    aws: "EC2"
    azure: "Virtual Machines"
    gcp_category: "Compute"
    oci: "virtual-machine-vm"
  # Monitoring service — Observability
  monitoring:
    aws: "CloudWatch"
    azure: "Monitor"
    gcp_category: "Management Tools"
    oci: "monitoring"
  # Logging service — Observability
  logging:
    aws: "CloudWatch"
    azure: "Log Analytics Workspaces"
    gcp_category: "Management Tools"
    oci: "logging"
  # Data science / ML workbench — AI/ML
  data_science:
    aws: "SageMaker AI"
    azure: "Machine Learning"
    gcp: "Vertex AI"
    oci: "data-science"
  # Block volume / managed block storage — Storage
  block_volume:
    aws: "Elastic Block Store"
    azure: "Disks"
    gcp_category: "Storage"
    oci: "block-storage"
  # Container registry (OCI OCIR; distinct ecr alias) — Containers
  container_registry:
    aws: "Elastic Container Registry"
    azure: "Container Registries"
    gcp_category: "Containers"
    oci: "container-registry"
  # Cloud Spanner — distributed SQL (GCP product glyph) — Databases
  spanner:
    aws: "Aurora"
    azure: "Cosmos DB"
    gcp: "Cloud Spanner"
    oci: "autonomous-db"
  # BigQuery — analytics warehouse (GCP product glyph) — Data Analytics
  bigquery:
    aws: "Athena"
    azure: "Synapse Analytics"
    gcp: "BigQuery"
    oci: "data-flow"

  # --- Organization / education (1.10.12, SEP feedback §1 / §2.1) -----------
  # The ORGANIZATION-level service (an org / management scope as one node).
  # Distinct from the single-account peer_account glyph. Azure's analogue is
  # Management Groups, OCI's the organization stencil; GCP has no product
  # glyph, so the Management Tools category stands in (Google's convention).
  organizations:
    aws: "Organizations"
    azure: "Management Groups"
    gcp_category: "Management Tools"
    oci: "organization"
  # Education / learning system (an LMS or course platform). No vendor pack
  # ships a neutral mortarboard, so the role carries no provider query: it
  # resolves to the engine-bundled CC0 asset (rule_engine/engine_assets) on
  # every provider (`source: bundled` in icon-index.json).
  education:
    asset: "assets/vendor/education/mortarboard.svg"
    display_name: "Education (mortarboard)"
