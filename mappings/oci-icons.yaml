# OCI icon mapping table for the Rule Engine Icon Resolver.
#
# OCI has NO built-in draw.io stencil library and NO `mxgraph.oci.*` shape ids
# exist anywhere (verified against the Oracle `OCI Library.xml`, which ships
# `shape=stencil(...)` glyphs keyed by title, not named mxgraph ids). So OCI does
# NOT resolve through a shape id like the other providers. Instead each neutral
# type references a `stencil` slug; `scripts/fetch_assets.py` decodes
# `OCI Library.xml` into `assets/vendor/oci-stencils/stencils.json` (slug -> ready-
# to-embed stencil XML), and the diagram generator (scripts/build_oci_example.py,
# rule_engine.diagram_layout.embed_oci_stencil) embeds that stencil group into the
# node at generation. Slugs are the title-derived keys produced by
# fetch_assets._slugify and were verified present in the library.
#
# The `style` here is a SELF-CONTAINED fallback: an OCI-red (#F80000) labelled box
# (see asset-packs.md "OCI note"). It renders correctly on its own when the
# stencil is not embedded, and keeps `resolve_icon` working (it requires a
# non-empty style). Brand anchor: OCI #F80000.
provider: oci
asset_pack: "OCI draw.io Style Guide library (OCI Library.xml, decoded to oci-stencils/stencils.json)"
icon_source: custom
resources:
  boundary:
    icon_id: oci.boundary
    brand_hex: "#F80000"
    stencil: "assets/vendor/oci-stencils/stencils.json#compartments"  # Identity and Security - Compartments
    style: "rounded=0;whiteSpace=wrap;html=1;fontFamily=Oracle Sans,Helvetica,Arial,sans-serif;fillColor=#FFFFFF;strokeColor=#F80000;fontColor=#312D2A;fontSize=12;verticalLabelPosition=bottom;verticalAlign=top;align=center"
