containers:
  # Container styles follow the official OCI Architecture Diagram Toolkit v24.2
  # (OCI Style Guide for draw.io) — a nested, neutral-grey nesting system, NOT
  # an all-red palette. Extracted verbatim from the reference file's Physical
  # templates. Palette source of truth: docs REVIEW.md D17.
  #   Tenancy / Compartment : dashed, transparent fill; Compartment stroke is
  #                           Oracle terracotta #AE562C, Tenancy neutral #9E9892.
  #   OCI Region            : fill #F5F4F2, neutral #9E9892 stroke, rounded.
  #   Availability Domain   : fill #DFDCD8 (a shade darker than Region).
  #   Fault Domain          : fill #FCFBFA, italic caption.
  #   Subnet / OSN          : dashed, terracotta #AE562C stroke+font (network).
  #   Tier                  : dashed 1 1, neutral.
  # Every level uses fontFamily=Oracle Sans and fontColor=#312D2A (Oracle near-
  # black) for its caption — never red text. Icons stay OCI-red per brand.
  boundary:
    icon_id: oci.compartment
    brand_hex: "#F80000"
    # Compartment boundary — terracotta dashed, transparent, left-aligned caption.
    style: "rounded=0;whiteSpace=wrap;html=1;dashed=1;dashPattern=1 1;strokeWidth=1;align=left;verticalAlign=top;fontFamily=Oracle Sans,Helvetica,Arial,sans-serif;fillColor=none;strokeColor=#AE562C;fontColor=#312D2A;fontSize=12;spacingLeft=5;fontStyle=1"
  network_boundary:
    icon_id: oci.virtual_cloud_network
    brand_hex: "#F80000"
    # VCN / Oracle Services Network — terracotta dashed network boundary.
    style: "rounded=0;whiteSpace=wrap;html=1;dashed=1;strokeWidth=2;align=left;verticalAlign=top;fontFamily=Oracle Sans,Helvetica,Arial,sans-serif;fillColor=none;strokeColor=#AE562C;fontColor=#AE562C;fontSize=12;spacingLeft=5;fontStyle=1"
  region:
    icon_id: oci.region
    brand_hex: "#F80000"
    # OCI Region — light-grey filled, neutral stroke, rounded, caption top-left
    # (the v24.2 template left-aligns "OCI Region"; AD/FD stay centred).
    style: "rounded=1;absoluteArcSize=1;arcSize=24;whiteSpace=wrap;html=1;align=left;spacingLeft=8;verticalAlign=top;fontFamily=Oracle Sans,Helvetica,Arial,sans-serif;fillColor=#F5F4F2;strokeColor=#9E9892;fontColor=#312D2A;fontSize=12;fontStyle=1"
  availability_domain:
    icon_id: oci.availability_domain
    brand_hex: "#F80000"
    # Availability Domain — one shade darker than Region, neutral stroke.
    style: "rounded=1;absoluteArcSize=1;arcSize=20;whiteSpace=wrap;html=1;strokeWidth=1;align=center;verticalAlign=top;fontFamily=Oracle Sans,Helvetica,Arial,sans-serif;fillColor=#DFDCD8;strokeColor=#9E9892;fontColor=#312D2A;fontSize=12;fontStyle=1"
  fault_domain:
    icon_id: oci.fault_domain
    brand_hex: "#F80000"
    # Fault Domain — near-white fill, italic caption, neutral stroke.
    style: "rounded=1;absoluteArcSize=1;arcSize=16;whiteSpace=wrap;html=1;strokeWidth=1;align=center;verticalAlign=top;fontFamily=Oracle Sans,Helvetica,Arial,sans-serif;fillColor=#FCFBFA;strokeColor=#9E9892;fontColor=#312D2A;fontSize=12;fontStyle=3"
  subnet:
    icon_id: oci.subnet
    brand_hex: "#F80000"
    # Subnet — terracotta dashed, transparent, left-aligned (network element).
    style: "rounded=0;whiteSpace=wrap;html=1;dashed=1;strokeWidth=1;align=left;verticalAlign=top;fontFamily=Oracle Sans,Helvetica,Arial,sans-serif;fillColor=none;strokeColor=#AE562C;fontColor=#AE562C;fontSize=12;spacingLeft=5;fontStyle=1"
