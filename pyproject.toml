[build-system]
requires = ["setuptools>=61.0"]
# In-tree backend (build_backend.py) that copies the workspace bootstrap payload
# (.kiro/steering, .kiro/hooks, mappings, schemas) into src/rule_engine/_bootstrap
# so rule-engine-init can bootstrap a fresh workspace from the installed package
# alone — even when only the Kiro Power / pip package is present, not the repo.
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "rule-engine"
version = "1.10.5"
description = "Diagram & Inventory Rule Engine — a cloud-agnostic Kiro project for deterministic diagram and inventory generation."
readme = "README.md"
# The engine supports Python 3.11 through 3.14 (the CI test matrix, task 21.5).
# 3.11 is the floor: it is the oldest interpreter still in upstream security
# support, and the engine uses no syntax newer than it. The previous 3.14-only
# floor needlessly excluded three supported runtimes. See INSTALL.md.
requires-python = ">=3.11"
license = { file = "LICENSE" }
# Runtime dependencies only, with version floors for reproducible builds. Test/
# dev tools live in the `dev` extra below so downstream consumers of the engine
# do not install them (REVIEW.md G3).
dependencies = [
    "jsonschema>=4.18",  # Draft 2020-12 validator (Draft202012Validator)
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Install with:  pip install -e ".[dev]"
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[project.scripts]
# Lint console entry point used by the lint-on-save / validate-on-task Kiro
# hooks and by the CI pipeline (task 6.2).
rule-engine-lint = "rule_engine.cli:main"
# Schema-validation console entry point used by the validate-on-task Kiro hook
# and by the CI pipeline (task 10.2).
rule-engine-validate-schema = "rule_engine.validate_schema_cli:main"
# Asset-index / icon-fallback entry point: index official provider icon packs and
# resolve specific service names (including services missing from built-in
# stencils) to an official SVG/PNG.
rule-engine-index-assets = "rule_engine.asset_index_cli:main"
# Asset-path guard: verify every mapping icon file path (image=<path>) exists
# under the fetched asset root. Used by the CI validate stage after fetch_assets.
rule-engine-check-asset-paths = "rule_engine.asset_paths_guard:main"
# Raster gate: verify every exported .drawio.png stays within the class-aware D7
# export budget (flow <= 1600px / < 500KB, landscape <= 3600px / < 2MB). Used by
# the CI validate stage.
rule-engine-check-rasters = "rule_engine.raster_gate:main"
# Snapshot gate (v1.6.0): verify every inventory-* Snapshot folder satisfies the
# mandated shape from inventory-standards.md — folder name (§3), the seven
# non-empty manifest fields (§4), one JSON per service domain and one subfolder
# per enumerated resource (§5). The linter checks snapshot file CONTENT
# (frontmatter, secret-safety); nothing checked the folder shape, so a
# hand-written snapshot could ship with an empty resources/ and a wrong
# file_count and still lint clean.
rule-engine-check-snapshot = "rule_engine.snapshot_gate:main"
# Icon-reference verifier (v1.3.0): resolve every resIcon/grIcon/image path
# in a .drawio against the provider's authoritative icon source, so a guessed
# id (which renders as an empty box) is caught before publication.
rule-engine-verify-icon = "rule_engine.verify_icon:main"

# Reconciliation gate (v1.9.0): compare a committed inventory Snapshot against
# the diagram generated from it and block when a role-bearing enumerated resource
# is silently absent from the diagram (the "ten KMS keys omitted while the
# companion asserted completeness" defect). Part of the Gate_Suite in CI.
rule-engine-reconcile = "rule_engine.reconcile:main"
# Snapshot→diagram autogenerator (v1.10.0): read a committed inventory Snapshot
# and emit the mandatory triple (.drawio + .diagram.md + best-effort raster) by
# resolving every resource to a role, laning it, and handing the coordinate-free
# DiagramSpec to the existing layout()+build_diagram() pipeline. Closes the
# deferred docs/REVIEW.md gap G8. Offline and deterministic; the raster export is
# best-effort so a missing draw.io CLI never blocks the .drawio + companion.
rule-engine-draw = "rule_engine.draw_cli:main"
# Init-time icon-set builder (v1.3.x): fetch the official provider icon packs and
# build the committed mappings/icon-index.json (per-role resolved icon per
# provider + pack summary). Run at installation; --check verifies it is current.
rule-engine-build-icon-sets = "rule_engine.build_icon_sets_cli:main"
# Raster exporter (v1.9.1): export a .drawio to its .drawio.png within the
# class-aware D7 budget, inlining local assets/vendor icons as base64 in a
# temp copy first. Packaged as a console script so it ships with pip / the
# Kiro Power (it used to live only in scripts/, unreachable from an installed
# package); scripts/export_raster.py is now a thin shim onto this.
rule-engine-export-raster = "rule_engine.export_raster:main"
# Edge orthogonaliser (v1.9.1): rewrite a hand-authored/hand-dragged .drawio
# so every edge leg is axis-aligned. Packaged for the same reason as the
# exporter; scripts/orthogonalise_drawio.py is now a thin shim onto this.
rule-engine-orthogonalise = "rule_engine.orthogonalise:main"
# Asset fetcher (v1.5.0): download & unpack the official provider icon packs into
# a target workspace's assets/vendor (and decode the OCI stencils). Importable
# from the installed package so a pip/Power install can materialize the GCP/OCI
# icon files without the repo's scripts/ dir. --workspace selects the target root.
rule-engine-fetch-assets = "rule_engine.fetch_assets:main"
# Workspace bootstrap (v1.5.0): copy the always-on steering rules, icon mappings,
# and schema into a target workspace so an agent running the power/skill in a
# fresh directory inherits the rules and resolves icons through the mappings —
# instead of guessing colors and boundary placement. --check reports what is
# missing; run this FIRST when generating artifacts in an empty workspace.
rule-engine-init = "rule_engine.init_workspace:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the bundled workspace bootstrap payload (steering rules, hooks, icon
# mappings, schema) staged by build_backend.py, so rule-engine-init works from
# the installed package with no repo checkout. The trees are git-ignored in the
# source tree; the build backend regenerates them for every wheel/sdist.
"rule_engine._bootstrap" = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
