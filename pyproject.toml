[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rule-engine"
version = "1.4.1"
description = "Diagram & Inventory Rule Engine — a cloud-agnostic Kiro project for deterministic diagram and inventory generation."
readme = "README.md"
# Python 3.14 is intentional: Python 3.10 reaches end-of-life in October 2026,
# so the engine targets a supported runtime (matched by the CI image
# python:3.14-slim). See INSTALL.md.
requires-python = ">=3.14"
license = { file = "LICENSE" }
# Runtime dependencies only, with version floors for reproducible builds. Test/
# dev tools live in the `dev` extra below so downstream consumers of the engine
# do not install them (REVIEW.md G3).
dependencies = [
    "jsonschema>=4.18",  # Draft 2020-12 validator (Draft202012Validator)
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Install with:  pip install -e ".[dev]"
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[project.scripts]
# Lint console entry point used by the lint-on-save / validate-on-task Kiro
# hooks and by the CI pipeline (task 6.2).
rule-engine-lint = "rule_engine.cli:main"
# Schema-validation console entry point used by the validate-on-task Kiro hook
# and by the CI pipeline (task 10.2).
rule-engine-validate-schema = "rule_engine.validate_schema_cli:main"
# Asset-index / icon-fallback entry point: index official provider icon packs and
# resolve specific service names (including services missing from built-in
# stencils) to an official SVG/PNG.
rule-engine-index-assets = "rule_engine.asset_index_cli:main"
# Asset-path guard: verify every mapping icon file path (image=<path>) exists
# under the fetched asset root. Used by the CI validate stage after fetch_assets.
rule-engine-check-asset-paths = "rule_engine.asset_paths_guard:main"
# Raster gate: verify every exported .drawio.png stays within the D7 export
# budget (<= 1200px wide, < 500KB). Used by the CI validate stage.
rule-engine-check-rasters = "rule_engine.raster_gate:main"
# Icon-reference verifier (v1.3.0): resolve every resIcon/grIcon/image path
# in a .drawio against the provider's authoritative icon source, so a guessed
# id (which renders as an empty box) is caught before publication.
rule-engine-verify-icon = "rule_engine.verify_icon:main"

# Init-time icon-set builder (v1.3.x): fetch the official provider icon packs and
# build the committed mappings/icon-index.json (per-role resolved icon per
# provider + pack summary). Run at installation; --check verifies it is current.
rule-engine-build-icon-sets = "rule_engine.build_icon_sets_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
