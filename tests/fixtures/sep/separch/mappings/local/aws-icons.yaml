# Workspace-local AWS icon overlay (merged per-key over the bundled mapping).
# Restores the `lambda_vpc` presentation role (VPC-attached Lambda) that the
# bundled 1.10.10 mapping does not ship, so build_08_network_crossaccount.py's
# `_image_renderer("lambda_vpc")` resolves. Mirrors the bundled `serverless_fn`
# entry (same AWS Lambda service icon, 78x78 aspect=fixed, label below).
resources:
  lambda_vpc:                # AWS Lambda, VPC-attached (same Lambda service icon)
    icon_id: aws.lambda
    icon_provenance: service
    brand_hex: "#ED7100"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/aws-icons/Architecture-Service-Icons_07312026/Arch_Compute/48/Arch_AWS-Lambda_48.svg"

  # Vendor-NEUTRAL license / certificate glyph (FIX 1, 2026-10-21). The SEP
  # "License Manager" node on 01 and 09 is an EPAM licensing service (account
  # 652063929809), NOT the AWS License Manager service. Rendering it with the
  # real AWS License Manager icon was an Icon-Fidelity violation (a look-alike
  # that implies an AWS service). It now resolves to a hand-authored,
  # vendor-neutral grayscale certificate-with-seal SVG under assets/vendor/custom/
  # — reads as "a license service, vendor-neutral", consistent with how MongoDB
  # (own brand) and DIAL (own brand) are handled. Neutral mark → neutral brand
  # grey, no AWS pink. The retired `license_manager` role (real AWS glyph) is no
  # longer defined — no SEP node references it.
  license_neutral:           # vendor-neutral license / certificate (NOT AWS License Manager)
    icon_id: neutral.license
    icon_provenance: neutral
    brand_hex: "#3C3C3C"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/custom/license-neutral.svg"

  # Multi-cloud sandbox fleet (FIX 3, 2026-10-21). The 09 "Sandbox fleets (3
  # clouds)" node spans AWS + Azure + GCP. It renders as a single cloud outline
  # enclosing the three provider marks (hand-authored composite under
  # assets/vendor/custom/ — each provider's brand colour + a recognizable mark,
  # the sanctioned tri-cloud fallback; not a look-alike of any one service icon).
  # Neutral/composite, so a neutral slate brand grey.
  sandbox_multicloud:        # one cloud with AWS / Azure / GCP marks inside
    icon_id: custom.sandbox_3cloud
    icon_provenance: neutral
    brand_hex: "#5B6B7B"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/custom/sandbox-3cloud.svg"

  # SEP brand mark (custom) — the Syndicate Education Platform system node on the
  # 01 C4-context view. File-path image shape (NO base64 → base64 trips
  # icon-resolved). The 168×168 square source scales undistorted into the 78×78
  # node via aspect=fixed; label below at 12px (Accessibility floor).
  # Path notes (two engine constraints, both worked around with file paths only
  # — NO base64 in the mapping):
  #  1. The raster exporter's inliner and _embed_asset_style only rewrite
  #     `image=assets/vendor/...` tokens, so the mark lives under
  #     assets/vendor/sep-brand/ (a copy also sits at the committed
  #     assets/local/sep-logo-black.png).
  #  2. _embed_asset_image hardcodes the `data:image/svg+xml` MIME for every
  #     embedded asset, so a raw PNG embeds with the WRONG mime and renders as a
  #     broken image. The mark is therefore an SVG wrapper (sep-logo-black.svg)
  #     that embeds the 168×168 PNG via an <image> element — a valid SVG, so the
  #     svg+xml MIME is correct and it renders in both the editor and the PNG.
  #  Both are logged as RULE-ENGINE-FEEDBACK (inline assets/local/; sniff the
  #  real MIME instead of hardcoding svg+xml).
  sep_platform:
    icon_id: sep.platform
    icon_provenance: neutral
    brand_hex: "#000000"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/sep-brand/sep-logo-black.svg"
  # LMS mortarboard / graduation-cap (owner request 2026-10-17, regen9). The
  # owner asked for a draw.io "Education" icon for the LMS. The installed draw.io
  # ships NO generic mortarboard stencil (there is no mxgraph.education.* library;
  # the only "Education" glyphs are Azure mscae PRODUCT images, a look-alike that
  # Icon Fidelity forbids on an AWS/non-Azure diagram). A bare mxgraph.* flat
  # stencil (e.g. mxgraph.ios7.icons.book) is ALSO not viable: verify_icon
  # --strict reports it `unverified` (the generic-shape extractor only accepts the
  # mxgraph.flowchart.*/networks.* neutral families), which FAILS the strict gate.
  # The faithful, gate-passing, licence-clean answer is a hand-authored
  # public-domain mortarboard SVG committed under assets/vendor/education/ and
  # wired as an image role (same mechanism as license_manager / sep_platform), so
  # it resolves as a real `image` ref and renders in the PNG. Neutral mark, so no
  # vendor brand_hex — a legible education blue.
  education:                 # LMS mortarboard / graduation cap (generic learning glyph)
    icon_id: edu.mortarboard
    icon_provenance: neutral
    brand_hex: "#2D7FF9"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/education/mortarboard.svg"

  # DIAL AI brand mark (owner-supplied asset 2026-10-17, regen9). The owner
  # provided the real EPAM DIAL logo (dial.png, 160×160). No fetched pack ships
  # the DIAL mark, so an owner-supplied brand asset is the clean path (not a
  # look-alike). Same PNG-in-SVG wrapper the SEP logo uses (the embedded-asset
  # inliner hardcodes the svg+xml MIME, so a raw PNG would render broken — wrap it
  # in an <image> SVG). Used ONLY for the dedicated DIAL node on 09; the 01 "AI
  # (Bedrock / DIAL)" node keeps the Bedrock icon (it represents both, and the
  # owner's "AI → Bedrock" applied there).
  dial:                      # EPAM DIAL AI proxy brand mark (owner-supplied)
    icon_id: dial.brand
    icon_provenance: neutral
    brand_hex: "#D4157C"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/dial-brand/dial.svg"

  # Argo CD brand mark (owner-supplied asset argo-cd.png, 2026-10-22, DIAG-11).
  # The in-cluster GitOps controller on 11-hybrid-eks. No fetched pack ships the
  # Argo CD mark, so an owner-supplied brand asset is the clean path (not a
  # look-alike). Same PNG-in-SVG wrapper the DIAL/SEP logos use (the embedded-
  # asset inliner hardcodes the svg+xml MIME, so a raw PNG would render broken).
  argocd:                    # Argo CD GitOps controller brand mark (owner-supplied)
    icon_id: argocd.brand
    icon_provenance: neutral
    brand_hex: "#EF7B4D"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/custom/argocd.svg"

  # AWS Organizations SERVICE icon (owner request 2026-10-17, regen9). The
  # ORGANIZATION-level service glyph (Arch_AWS-Organizations), DISTINCT from the
  # single-account peer_account glyph (Res_AWS-Organizations_Account) used for a
  # peer account node. The 09 "Sandbox-mgmt + Logging org" node is an org, so it
  # carries the org-level service icon. Management & Governance family pink.
  organizations:             # AWS Organizations (service, org-level — NOT a single account)
    icon_id: aws.organizations
    icon_provenance: service
    brand_hex: "#E7157B"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/aws-icons/Architecture-Service-Icons_07312026/Arch_Management-Tools/48/Arch_AWS-Organizations_48.svg"
  # Generic data-store family glyph (phase-2 12-sep-access, 2026-11-03). The 12
  # access diagram aggregates the platform data stores (S3 / DynamoDB / RDS /
  # Secrets / SSM) into ONE resource node; a single service icon (e.g. S3) would
  # misstate the family, so it uses the official AWS General "Database" resource
  # glyph (vendor pack, no recolour).
  data_store_family:         # aggregated data stores (AWS General Database glyph)
    icon_id: aws.res.general_database
    icon_provenance: resource
    brand_hex: "#232F3E"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/aws-icons/Resource-Icons_07312026/Res_General-Icons/Res_48_Light/Res_Database_48_Light.svg"
