    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/networking/DNS_Zones.svg"

  # --- External / third-party systems (Theme 1) ---
  external_system:
    icon_id: external.system
    brand_hex: "#333333"
    style: "rounded=1;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#333333;dashed=1;verticalAlign=middle;fontSize=12"
  # MongoDB Atlas — identification-use neutral box in MongoDB green; leaf mark not redistributed.
  mongodb_atlas:
    icon_id: mongodb.atlas
    icon_provenance: neutral
    brand_hex: "#13AA52"
    # 1.10.11 (Opt 2): the real MongoDB leaf silhouette, colorized to brand green
    # at fetch time into the git-ignored assets/vendor/opensource-colorized and
    # referenced by file path — the mark is identification use, never committed.
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/opensource-colorized/mongodb.svg"
  # Open-source brand leaves (feedback Theme 35) — colorized Simple Icons, same
  # path as mongodb_atlas; resolve once --update-pins populates the dir.
  keycloak:
    icon_id: keycloak
    icon_provenance: neutral
    brand_hex: "#4D4D4D"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/opensource-colorized/keycloak.svg"
  redis:
    icon_id: redis
    icon_provenance: neutral
    brand_hex: "#FF4438"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/opensource-colorized/redis.svg"
  postgresql:
    icon_id: postgresql
    icon_provenance: neutral
    brand_hex: "#4169E1"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/opensource-colorized/postgresql.svg"
  # Fleet of N (Theme 22) — stacked-box glyph for a count of like resources.
  fleet:
    icon_id: fleet.stack
    icon_provenance: neutral
    brand_hex: "#333333"
    style: "shape=mxgraph.flowchart.multiple_documents;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#333333;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12"
  # Peer AWS/Azure account AND peer cloud AS A NODE (feedback Theme 34). A high-
  # level node for a peer Azure subscription / peer cloud carries Azure's own
  # Subscriptions glyph (the built-in azure2 shape, consistent with this
  # profile) instead of a grey box — the one-role-per-service choice, not a
  # look-alike. Resolved only for a NodeSpec role; the peer_account CONTAINER
  # kind (resolve_container) is untouched.
  peer_account:
    icon_id: azure2.subscriptions
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/general/Subscriptions.svg"
  external_cloud:
    icon_id: azure2.subscriptions
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/general/Subscriptions.svg"
  # Education / learning system (1.10.12) — the provider-neutral CC0
  # mortarboard bundled with the engine (see aws-icons.yaml `education`).
  education:
    icon_id: education.mortarboard
    icon_provenance: neutral
    brand_hex: "#333333"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/education/mortarboard.svg"

containers:
  # Container styles follow Microsoft's published Azure architecture diagrams
  # (Azure Architecture Center, e.g. "Extend on-premises AD DS to Azure"): the
  # Virtual network is a DOTTED Azure-blue border with a plain caption; the
  # zones/subnets inside it are light-grey (#F2F2F2) filled blocks with NO
  # border and a bold black caption. Captions are black (#000000), never blue on
  # blue. Source of truth for the HA builder and rule-engine-draw (REVIEW.md D18).
  boundary:
    icon_id: azure.subscription
    brand_hex: "#0078D4"
    # Subscription — dashed Azure blue, bold black caption.
    style: "rounded=0;whiteSpace=wrap;html=1;dashed=1;dashPattern=8 4;strokeColor=#0078D4;fillColor=none;verticalAlign=top;align=left;spacingLeft=8;fontColor=#000000;fontStyle=1;fontSize=12"
  network_boundary:
    icon_id: azure.virtual_network
    brand_hex: "#0078D4"
    # Virtual network — dotted Azure blue, with the Virtual Networks icon in the
    # top-left corner as in the reference (draw.io label shape: image + text).
    style: "shape=label;image=img/lib/azure2/networking/Virtual_Networks.svg;imageWidth=26;imageHeight=16;imageAlign=left;imageVerticalAlign=top;rounded=0;whiteSpace=wrap;html=1;dashed=1;dashPattern=1 3;strokeWidth=2;strokeColor=#0078D4;fillColor=none;verticalAlign=top;align=left;spacingLeft=36;spacingTop=2;fontColor=#000000;fontSize=12"
  availability_domain:
    icon_id: azure.availability_zone
    brand_hex: "#0078D4"
    # Availability Zone (the zone level; kind name shared with OCI's AD) —
    # light-grey block, no border, bold black caption.
    style: "rounded=0;whiteSpace=wrap;html=1;fillColor=#F2F2F2;strokeColor=none;verticalAlign=top;align=center;fontColor=#000000;fontStyle=1;fontSize=12"
  region:
    icon_id: azure.region
    brand_hex: "#0078D4"
    # Azure region — dashed neutral grey frame, bold black caption.
    style: "rounded=0;whiteSpace=wrap;html=1;dashed=1;dashPattern=8 4;strokeColor=#737373;fillColor=none;verticalAlign=top;align=left;spacingLeft=8;fontColor=#000000;fontStyle=1;fontSize=12"
  subnet:
    icon_id: azure.subnet
    brand_hex: "#0078D4"
    # Subnet — borderless light-grey block with the Subnet icon, bold caption.
    style: "shape=label;image=img/lib/azure2/networking/Subnet.svg;imageWidth=20;imageHeight=12;imageAlign=left;imageVerticalAlign=top;rounded=0;whiteSpace=wrap;html=1;fillColor=#F2F2F2;strokeColor=none;verticalAlign=top;align=left;spacingLeft=30;fontColor=#000000;fontStyle=1;fontSize=12"
  # 1.11.0 WS6: Network Security Group — dashed Azure-blue rect, no fill, leaf.
  security_group:
    icon_id: azure.security_group
    brand_hex: "#0078D4"
    style: "rounded=0;whiteSpace=wrap;html=1;dashed=1;dashPattern=8 4;strokeColor=#0078D4;fillColor=none;verticalAlign=top;align=left;spacingLeft=8;fontColor=#000000;fontSize=12"
