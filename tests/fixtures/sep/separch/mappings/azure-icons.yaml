    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/networking/Firewalls.svg"

  # --- 1.11.0 WS6: network diagram-type roles (extended roles only; not in
  # constants.RESOURCE_TYPES). Azure networking blue #0078D4, built-in azure2
  # shapes. ------------------------------------------------------------------
  transit_gateway:
    icon_id: azure2.virtual_wans
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/networking/Virtual_WANs.svg"
  vpn_gateway:
    icon_id: azure2.virtual_network_gateways
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/networking/Virtual_Network_Gateways.svg"
  direct_connect:
    icon_id: azure2.expressroute_circuits
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/networking/ExpressRoute_Circuits.svg"
  route_table:
    icon_id: azure2.route_tables
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/networking/Route_Tables.svg"
  network_firewall:
    icon_id: azure2.firewalls
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/networking/Firewalls.svg"
  # --- 1.11.0 WS7 access diagram type: principal / policy / resource ---
  # Azure's access model: a principal is a Managed Identity, a policy is an
  # Azure Policy, a resource is the generic All-Resources glyph. Built-in
  # azure2 shape paths (the convention every azure entry here uses), subdir
  # mirrors the vendor tree (identity/ , general/). Extended roles only.
  principal:                 # Managed Identity — the access subject
    icon_id: azure2.managed_identities
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/identity/Managed_Identities.svg"
  policy:                    # Azure Policy — the grant
    icon_id: azure2.policy
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/general/Policy.svg"
  resource:                  # All Resources — the object
    icon_id: azure2.all_resources
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/general/All_Resources.svg"
  api_gateway:
