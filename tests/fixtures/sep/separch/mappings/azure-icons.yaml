  cdn:
    icon_id: azure2.front_doors
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/networking/Front_Doors.svg"
  iam:
    icon_id: azure2.azure_active_directory
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/identity/Azure_Active_Directory.svg"
  log_analytics:
    icon_id: azure2.log_analytics_workspaces
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/management_governance/Log_Analytics_Workspaces.svg"
  container_apps:
    icon_id: azure2.container_app_environments
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/other/Container_App_Environments.svg"
  cognitive_services:
    icon_id: azure2.cognitive_services
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/ai_machine_learning/Cognitive_Services.svg"
  bastion:
    icon_id: azure2.bastions
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/networking/Bastions.svg"
  app_service:
    icon_id: azure2.app_services
    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/app_services/App_Services.svg"
  eventbridge:
