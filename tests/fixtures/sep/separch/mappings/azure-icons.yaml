    brand_hex: "#0078D4"
    style: "image;aspect=fixed;html=1;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=img/lib/azure2/integration/Event_Grid_Topics.svg"
  dns:
