containers:
  # Cluster envelope — k8s-blue dashed box with a top-left caption, matching the
  # cloud-account group convention (caption meets 4.5:1 on white at #326CE5).
  boundary:
    icon_id: k8s.cluster
    brand_hex: "#326CE5"
    style: "rounded=0;whiteSpace=wrap;html=1;fillColor=none;strokeColor=#326CE5;dashed=1;verticalAlign=top;align=left;spacingLeft=30;fontColor=#326CE5;fontSize=12"
  # Namespace — the network_boundary-level box (the k8s profile's "network
  # boundary" IS the namespace). A light blue fill distinguishes it from the
  # cluster envelope.
  network_boundary:
    icon_id: k8s.namespace
    brand_hex: "#326CE5"
    style: "rounded=0;whiteSpace=wrap;html=1;fillColor=none;strokeColor=#326CE5;dashed=1;verticalAlign=top;align=left;spacingLeft=30;fontColor=#326CE5;fontSize=12"
  # Namespace as a first-class LEAF container kind (1.10.11) — holds workloads
  # directly; same visual as network_boundary so a Namespace reads identically
  # whether declared as the network boundary or as a nested leaf.
  namespace:
    icon_id: k8s.namespace
    brand_hex: "#326CE5"
    style: "rounded=0;whiteSpace=wrap;html=1;fillColor=none;strokeColor=#326CE5;dashed=1;verticalAlign=top;align=left;spacingLeft=30;fontColor=#326CE5;fontSize=12"
