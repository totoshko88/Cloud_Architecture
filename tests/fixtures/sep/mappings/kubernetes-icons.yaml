# Kubernetes icon mapping table for the Diagram & Inventory Rule Engine.
#
# The `kubernetes` profile (1.10.11) is an ORCHESTRATOR-PLATFORM profile, not a
# cloud account. Its structural model is:
#
#   Cluster  (boundary)              ← the k8s cluster envelope
#     └ Namespace (namespace / network_boundary)   ← LEAF boundary holding
#          workloads (deployments / pods / services) directly
#
# Icons are the OFFICIAL Kubernetes Icons Set (kubernetes/community/icons),
# licensed Apache-2.0 / CC-BY-4.0 — a permissive, redistributable set (unlike
# the SaaS brand marks). The k8s logo itself is a Linux Foundation trademark,
# but the resource icons (pod / deploy / svc / …) are free to use. We use the
# UNLABELED variant and let the engine draw the service caption, so a node
# carries exactly one label.
#
# All paths are relative to the git-ignored asset root (assets/vendor/k8s-icons).
# The pack is fetched by scripts/fetch_assets.py from asset-sources.yaml
# (a pinned git-archive tarball of kubernetes/community at a fixed commit).
#
# Brand anchor: Kubernetes blue #326CE5.
provider: kubernetes
asset_pack: "Kubernetes Icons Set (kubernetes/community, Apache-2.0 / CC-BY-4.0)"
icon_source: custom

# Path prefix for the unlabeled resource/control-plane SVGs inside the pack.
# resources:            icons/svg/resources/unlabeled/<name>.svg
# control plane:        icons/svg/control_plane_components/unlabeled/<name>.svg
# infrastructure:       icons/svg/infrastructure_components/unlabeled/<name>.svg

resources:
  # ==========================================================================
  # Nine neutral resource types (inventory schema) — mapped to the closest
  # native Kubernetes object (see profiles/terminology.yaml / provider-profiles).
  # ==========================================================================

  # boundary → Cluster: resolved via the containers table below (structural).
  # network_boundary → Namespace: resolved via the containers table below.

  serverless_fn:             # → Job (ephemeral run-to-completion workload)
    icon_id: k8s.job
    icon_provenance: service
    brand_hex: "#326CE5"
    style: "image;html=1;aspect=fixed;points=[];align=center;verticalLabelPosition=bottom;verticalAlign=top;fontSize=12;image=assets/vendor/k8s-icons/icons/svg/resources/unlabeled/job.svg"

  object_store:              # → PersistentVolume
