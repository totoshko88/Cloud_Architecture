name: CI

# Continuous integration for the Diagram & Inventory Rule Engine.
#
# Mirrors the GitLab lint + validate stages (.gitlab-ci.yml) and additionally
# runs the test suite — including the property-based (hypothesis) tests — which
# the GitLab pipeline does not. Runs on pushes and pull requests.
#
#   lint     — run the Linter over every diagram + Markdown document; fail on a
#              CRITICAL or ERROR finding (Requirement 10.2/10.3).
#   validate — validate the golden examples against the Inventory Schema, confirm
#              the schema is a valid JSON Schema, and confirm every
#              mappings/<provider>-icons.yaml is well-formed (Requirement 10.2).
#   test     — pytest across a Python version matrix (unit + property-based).
#
# v1.6.1: the release workflow CALLS this workflow (``workflow_call``) and needs
# it to pass, so a tag is published only after the exact same gate that guards a
# pull request — not the two-step subset the release job used to re-run.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

# Least privilege: every job here only reads the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # R11.2: run the tests on every minor Python version from the lower
        # bound (3.11, the pyproject requires-python floor per decision D6) up
        # to 3.14. Add newer versions here as they are released to catch
        # forward-incompat early.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests (unit + property-based)
        run: pytest -q

  lint:
    name: lint (diagrams + documents)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Lint (fail on CRITICAL/ERROR)
        run: rule-engine-lint --all --fail-on error,critical

  validate:
    name: validate (schema + mappings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install (with dev extras)
        # Dev extras are needed for the generator-freshness step, which runs
        # `pytest tests/test_generators_fresh.py` to exercise every generator's
        # --check (R8.1).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate golden examples against the Inventory Schema
        run: rule-engine-validate-schema --schema schemas/inventory.schema.json --targets 'examples/**/*.json'
      - name: Confirm the Inventory Schema is a valid JSON Schema
        run: |
          python -c "
          import json
          from jsonschema import Draft202012Validator
          with open('schemas/inventory.schema.json', encoding='utf-8') as fh:
              schema = json.load(fh)
          Draft202012Validator.check_schema(schema)
          print('OK: schemas/inventory.schema.json is a valid JSON Schema')
          "
      - name: Confirm every mappings/<provider>-icons.yaml is well-formed YAML
        run: |
          python -c "
          import glob, sys, yaml
          failures = []
          files = sorted(glob.glob('mappings/*-icons.yaml'))
          if not files:
              print('ERROR: no mappings/<provider>-icons.yaml files found', file=sys.stderr)
              sys.exit(1)
          for path in files:
              try:
                  with open(path, encoding='utf-8') as fh:
                      yaml.safe_load(fh)
                  print('OK:  ' + path)
              except yaml.YAMLError as exc:
                  failures.append(path + ': ' + str(exc))
          if failures:
              print('BLOCKING: malformed mapping YAML:', file=sys.stderr)
              for reason in failures:
                  print('    - ' + reason, file=sys.stderr)
              sys.exit(1)
          "
      - name: Fetch official icon packs so file-path icon references can be verified
        # GCP maps to both gcp-category and gcp-core (product-first priority);
        # Azure/AWS/OCI to their packs. v1.7.0 (R6.1-R6.3): the packs are pinned
        # (sha256 + size) and fetched over HTTPS only, so a fetch failure is a
        # pin/integrity/transport failure — NOT a transient we should paper over.
        # The old ``|| echo WARNING`` let a failed fetch silently skip the
        # asset-paths guard; the fetch now fails the job.
        run: python scripts/fetch_assets.py --only gcp_category gcp_core azure aws oci
      - name: Verify every mapping icon file path exists under the asset root
        # Call the declared console script (not python -m) so a broken
        # [project.scripts] entry-point mapping is caught by CI too.
        run: rule-engine-check-asset-paths
      - name: Verify the committed icon index is current with the official packs
        # Rebuild mappings/icon-index.json from the fetched packs and confirm the
        # committed file is byte-identical (no stale role->icon wiring).
        # v1.6.1: BLOCKING. The old ``|| echo WARNING`` turned a stale index into
        # a log line, so the check could never fail. --allow-missing still skips
        # (with a warning) when a pack failed to download — a network problem is
        # not a stale index. If a vendor republishes a pack, this fails until the
        # index is rebuilt: that is the signal the check exists to give.
        run: rule-engine-build-icon-sets --check --no-fetch --allow-missing
      - name: Verify every diagram icon reference resolves (incl. azure2 img/lib paths)
        # A well-formed-but-nonexistent id/path renders as an empty/broken icon
        # the linter cannot see. Checks aws4 ids, azure2 img/lib paths (against
        # mappings/azure2-shapes.json), GCP asset paths, and OCI slugs.
        # v1.7.0 (R4.3): ``--all`` walks examples/ with the Lint_CLI discovery
        # filters (no fragile shell glob), and ``--strict`` also fails on an
        # *unverified* service vertex or a file with service vertices and zero
        # verified refs — a ``skipped`` ref counts as not-verified, so a diagram
        # checked without its assets fails rather than passing on zero checks.
        run: rule-engine-verify-icon --all --strict
      - name: Verify CHANGELOG release dates
        # Every numbered release heading carries a real YYYY-MM-DD date, dates
        # never increase going down the file, and none is in the future (one day
        # of timezone slack). Added after 1.10.1: 1.9.0-1.10.1 shipped dated up to
        # four days ahead and nothing noticed.
        run: python -m rule_engine.version_guard --dates CHANGELOG.md
      - name: Verify every Generated_Example is fresh (generator --check, all thirteen)
        # R8.1: every Example_Generator has a --check mode that regenerates in
        # memory and compares with the committed file. The generator table lives
        # in scripts/regen_examples.py (GENERATORS: nine generators, thirteen
        # examples) and tests/test_generators_fresh.py imports it, so the set
        # regenerated locally and the set checked here are the same list. A new
        # build_*_example.py that is not registered fails the test too.
        #
        # Also runs tests/test_layout_split_properties.py here: since v1.10.2 the
        # committed examples embed data-URI icons whose bytes come from the
        # fetched packs, so its byte-identity / --check assertions can only be
        # reproduced WITH the packs — they skip in the asset-less ``test`` job and
        # run for real here, after the fetch above.
        run: pytest -q tests/test_generators_fresh.py tests/test_layout_split_properties.py
      - name: Enforce the exported .drawio.png export budget (D7, R8.3)
        # Class-aware budget: flow rasters <=1600px/<500KB, landscape <=3600px/<2MB.
        # The linter checks the .drawio source + companion, not the rendered PNG,
        # so this guard closes that gap. Call the declared console script so a
        # broken [project.scripts] mapping is caught. Run WITHOUT --allow-missing
        # (strict): a .drawio with no exported .png is a failure, and R8.3 makes
        # an empty run (no sources found) exit non-zero rather than silently pass.
        run: rule-engine-check-rasters
      - name: Verify every edge leg is explicitly axis-aligned
        # An orthogonalEdgeStyle edge never draws a diagonal: draw.io inserts its
        # OWN corner between two unaligned points and picks the direction, which
        # can differ by a whole icon. Generated diagrams are aligned by the
        # builder; this catches a hand-authored or hand-dragged .drawio.
        run: |
          rc=0
          while IFS= read -r f; do
            python scripts/orthogonalise_drawio.py --check "$f" || rc=1
          done < <(find examples -name '*.drawio' -type f)
          [ "$rc" -eq 0 ] || { echo "BLOCKING: unaligned edge leg(s); run scripts/orthogonalise_drawio.py"; exit 1; }
      - name: Enforce the inventory Snapshot folder shape
        # The linter checks snapshot file CONTENT (frontmatter, secret-safety);
        # nothing checked the folder SHAPE, so a hand-written snapshot could ship
        # with an empty resources/ and a wrong file_count and still lint clean —
        # exactly what a clean-room install produced. --strict so a stale
        # file_count fails the reference set too.
        run: rule-engine-check-snapshot --root examples --strict
      - name: Verify the example Snapshot data files are current
        # The per-domain JSON and per-resource documents are generated, so a
        # hand-edit that drifts from the generator is caught here.
        run: python scripts/build_example_snapshots.py --check
      - name: Reconcile every shipped Snapshot against its diagram (Gate_Suite)
        # v1.9.0 (R2.6): the inventory -> diagram reconciliation gate. Compare
        # each committed inventory-* Snapshot against the diagram generated from
        # it and block when a role-bearing enumerated resource is silently absent
        # from the diagram (the "ten KMS keys omitted while the companion
        # asserted completeness" defect). Called as the declared console script,
        # consistently with the other Gate_Suite members (rule-engine-lint,
        # rule-engine-verify-icon, rule-engine-check-rasters), so a broken
        # [project.scripts] mapping is caught here too. Each pair is the Snapshot
        # folder's related_docs diagram; a non-zero exit (a named omission) fails
        # the job. Coverage_Class is read from each diagram's companion
        # diagram_class.
        run: |
          rule-engine-reconcile --provider aws \
            --snapshot examples/aws/inventory-aws-123456789012-us-east-1-2026-09-22_1430 \
            --diagram examples/aws/01-aws-agent-platform.drawio
          rule-engine-reconcile --provider generic \
            --snapshot examples/generic/inventory-generic-env-prod-region-1-2026-09-22_1430 \
            --diagram examples/generic/01-generic-reference-architecture.drawio
      - name: Verify the workspace bootstrap works from the installed package
        # Regression guard for the build_backend _PAYLOAD / init _BUNDLE_MAP sync:
        # bootstrap a FRESH empty workspace from the installed engine, then
        # --check must report it complete. Running against an empty dir (not the
        # repo) genuinely exercises the package -> workspace copy path, so a
        # payload that ships incompletely in the wheel is caught here.
        #
        # R7 lock file: after bootstrapping, EDIT one steering file, then re-run
        # --check. A user edit must be classified "edited" and KEPT (never
        # overwritten on a bare run), so --check reports EDITED and still exits 0
        # — only a missing or stale file is blocking. This pins the lock-file
        # state machine: a user edit is not a gate failure.
        run: |
          ws="$(mktemp -d)"
          rule-engine-init "$ws"
          rule-engine-init --check "$ws"
          echo "" >> "$ws/.kiro/steering/diagram-lint.md"
          out="$(rule-engine-init --check "$ws")"
          echo "$out"
          echo "$out" | grep -qi 'edited' || { echo "BLOCKING: --check did not report the edited file"; exit 1; }
