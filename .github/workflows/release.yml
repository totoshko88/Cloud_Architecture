name: Release

# Tag-triggered release for the Diagram & Inventory Rule Engine.
#
# Mirrors the GitLab release stages (.gitlab-ci.yml: version-guard → build →
# publish) on GitHub: on a pushed ``v*`` tag it re-runs the lint + validate
# gate, packages the Release Bundle (steering docs, mappings, Inventory Schema,
# examples, the add-a-provider runbook, the design doc, README, VERSION), pulls
# the release notes from the matching CHANGELOG.md section, and publishes a
# GitHub Release with the bundle attached.
#
# The Semantic Version is the tag without a leading ``v`` (v1.2.3 -> 1.2.3).
# The tag's version MUST have a section in CHANGELOG.md (the source of truth for
# per-version history) or the release fails — no bundle is published.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub Release + upload the bundle asset

jobs:
  release:
    name: build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Lint gate (fail on CRITICAL/ERROR)
        run: rule-engine-lint --all --fail-on error,critical

      - name: Validate schema + examples
        run: rule-engine-validate-schema --schema schemas/inventory.schema.json --targets 'examples/**/*.json'

      - name: Release notes from CHANGELOG
        id: notes
        run: |
          python scripts/changelog_section.py "${{ steps.ver.outputs.version }}" > RELEASE_NOTES.md
          echo "Extracted release notes for ${{ steps.ver.outputs.version }}:"
          cat RELEASE_NOTES.md

      - name: Package the Release Bundle
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          echo "${VERSION}" > VERSION
          BUNDLE="rule-engine-${VERSION}.tar.gz"
          tar -czf "${BUNDLE}" \
            .kiro/steering/ \
            mappings/ \
            schemas/inventory.schema.json \
            examples/ \
            docs/add-a-provider.md \
            .kiro/specs/multicloud-diagram-inventory/design.md \
            README.md \
            VERSION
          echo "BUNDLE=${BUNDLE}" >> "$GITHUB_ENV"
          ls -l "${BUNDLE}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.ver.outputs.version }}"
          body_path: RELEASE_NOTES.md
          files: ${{ env.BUNDLE }}
          fail_on_unmatched_files: true
