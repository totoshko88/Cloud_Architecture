# CI Pipeline definition for the Diagram & Inventory Rule Engine.
#
# Requirement 10 (Distribution, Documentation, and CI/CD):
#   - 10.1  CI Pipeline definition stored under version control (this file).
#   - 10.2  Run the Linter over every diagram + document; validate every
#           mappings/<provider>-icons.yaml and the Inventory Schema.
#   - 10.4  On a release trigger, package a Release Bundle: steering docs,
#           mappings, Inventory Schema, examples, and the add-a-provider runbook
#           (docs/add-a-provider.md).
#   - 10.5  Name every Release Bundle with a Semantic Version identifier.
#   - 10.6  The Changelog is HAND-CURATED: the maintainer writes each release's
#           added/changed/removed section before tagging; CI never rewrites it.
#   - 10.10 Publish the Release Bundle and the Changelog as artifacts.
#
# Fail conditions (task 12.2):
#   - 10.3  IF the Linter reports >= 1 CRITICAL or ERROR finding, THEN fail the
#           run and produce NO Release Bundle. The `lint` stage runs first and
#           exits non-zero via `--fail-on error,critical`; the release stages
#           (`version-guard`, `build`, `changelog`, `publish`) declare
#           `needs: [lint, validate, test]` so a failed gate stops the pipeline
#           and no bundle is ever packaged.
#   - 10.7  IF the release trigger's Semantic Version has NO curated section in
#           the Changelog, THEN fail the run and produce NO Release Bundle. The
#           `version-guard` stage runs `src/rule_engine/version_guard.py` BEFORE
#           `build`, and `build` re-checks it. (v1.6.1: this header used to state
#           the opposite condition — "already exists" — which is not what the
#           guard does or what Requirement 10.7 says.)
#   - v1.6.1 The tag, pyproject.toml and the newest CHANGELOG.md heading must
#           name the same version: `build` writes VERSION from the tag and runs
#           `version_guard --triple`, which fails closed on any disagreement.

stages:
  - lint
  - validate
  - test
  - version-guard
  - build
  - changelog
  - publish

# ---------------------------------------------------------------------------
# Global configuration
# ---------------------------------------------------------------------------
default:
  image: python:3.14-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # The Semantic Version for a release run. On a tag pipeline the version is
  # derived from the tag (CI_COMMIT_TAG, e.g. "v1.2.3" or "1.2.3"); non-tag
  # runs fall back to the placeholder below and do not publish a release.
  RELEASE_VERSION: "0.0.0"
  # Name every Release Bundle with a Semantic Version (Requirement 10.5).
  BUNDLE_NAME: "rule-engine"

cache:
  paths:
    - .cache/pip

# Reusable install step: install the package (with runtime + CI deps) so the
# rule-engine-lint / rule-engine-validate-schema console scripts are available.
.install: &install
  - python --version
  - pip install --upgrade pip
  - pip install -e .

# A release run is triggered by a Git tag. Non-tag pipelines run lint + validate
# + test only; version-guard/build/changelog/publish are release-only
# (Requirement 10.4).
.release_rules: &release_rules
  rules:
    - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# Stage: lint
#   Run the Linter over every diagram + document. A single CRITICAL or ERROR
#   finding fails the run (Requirement 10.2, 10.3). --fail-on error,critical
#   makes the gate fail-closed; WARNING findings do not block.
# ---------------------------------------------------------------------------
lint:
  stage: lint
  before_script: *install
  script:
    - echo "Linting every diagram and Markdown document (fail on CRITICAL/ERROR)"
    - rule-engine-lint --all --fail-on error,critical

# ---------------------------------------------------------------------------
# Stage: validate
#   Validate the golden examples against the Inventory Schema, confirm the
#   Inventory Schema is itself a valid JSON Schema, and confirm every
#   mappings/<provider>-icons.yaml is well-formed YAML (Requirement 10.2).
# ---------------------------------------------------------------------------
validate:
  stage: validate
  before_script: *install
  script:
    - echo "Validating golden examples against the Inventory Schema"
    - rule-engine-validate-schema --schema schemas/inventory.schema.json --targets 'examples/**/*.json'
    - echo "Confirming the Inventory Schema is a valid JSON Schema"
    - |
      python -c "
      import json, sys
      from jsonschema import Draft202012Validator
      with open('schemas/inventory.schema.json', encoding='utf-8') as fh:
          schema = json.load(fh)
      Draft202012Validator.check_schema(schema)
      print('OK: schemas/inventory.schema.json is a valid JSON Schema')
      "
    - echo "Confirming every mappings/<provider>-icons.yaml is well-formed YAML"
    - |
      python -c "
      import glob, sys, yaml
      failures = []
      files = sorted(glob.glob('mappings/*-icons.yaml'))
      if not files:
          print('ERROR: no mappings/<provider>-icons.yaml files found', file=sys.stderr)
          sys.exit(1)
      for path in files:
          try:
              with open(path, encoding='utf-8') as fh:
                  yaml.safe_load(fh)
              print('OK:  ' + path)
          except yaml.YAMLError as exc:
              failures.append(path + ': ' + str(exc))
      if failures:
          print('BLOCKING: malformed mapping YAML:', file=sys.stderr)
          for reason in failures:
              print('    - ' + reason, file=sys.stderr)
          sys.exit(1)
      "
    - echo "Fetching official icon packs so file-path icon references can be verified"
    - python scripts/fetch_assets.py --only gcp_category gcp_core azure aws oci || echo "WARNING: asset fetch failed; asset-paths guard will skip"
    - echo "Verifying every mapping icon file path exists under the asset root"
    # Call the declared console script (not python -m) so a broken
    # [project.scripts] entry-point mapping is caught by CI too.
    - rule-engine-check-asset-paths
    - echo "Verifying the committed icon index is current with the official packs"
    # Icon-set index (v1.3.x): rebuild from the fetched packs and confirm the
    # committed mappings/icon-index.json is byte-identical (no stale role→icon
    # wiring). v1.6.1: BLOCKING — the old `|| echo WARNING` meant a stale index
    # could never fail the pipeline. --allow-missing still skips (with a
    # warning) when a pack failed to download.
    - rule-engine-build-icon-sets --check --no-fetch --allow-missing
    - echo "Verifying every diagram icon reference resolves (incl. azure2 img/lib paths)"
    # Icon-reference verifier: a well-formed-but-nonexistent id/path renders as an
    # empty/broken icon that the linter's icon-resolved rule cannot see. This
    # checks aws4 ids, azure2 img/lib paths (against mappings/azure2-shapes.json),
    # GCP asset paths, and OCI slugs. Fail-honest: skips a source not present.
    # ``find`` recurses reliably; a bare ``examples/**/*.drawio`` glob is NOT
    # recursive under a POSIX shell (no globstar) and would silently only match
    # one directory level, skipping any nested example.
    - |
      rc=0
      for f in $(find examples -name '*.drawio' -type f); do
        rule-engine-verify-icon --file "$f" || rc=1
      done
      [ "$rc" -eq 0 ] || { echo "BLOCKING: unresolved icon reference(s) — see above"; exit 1; }
    - echo "Enforcing the class-aware exported .drawio.png budget (flow <=1600px/<500KB, landscape <=3600px/<2MB)"
    # Raster gate (REVIEW.md D7): the linter checks the .drawio source + companion
    # document, not the rendered PNG, so this guard fails-closed on an oversized or
    # oversize raster. Call the declared console script so a broken
    # [project.scripts] mapping is caught. Rasters must stay within budget.
    - rule-engine-check-rasters
    - echo "Verifying every edge leg is explicitly axis-aligned"
    # draw.io picks its own corner between two unaligned points; generated
    # diagrams are aligned by the builder, this catches hand-authored sources.
    - |
      rc=0
      for f in $(find examples -name '*.drawio' -type f); do
        python scripts/orthogonalise_drawio.py --check "$f" || rc=1
      done
      [ "$rc" -eq 0 ] || { echo "BLOCKING: unaligned edge leg(s)"; exit 1; }
    - echo "Enforcing the inventory Snapshot folder shape (inventory-standards §3-§5)"
    # The linter checks snapshot file CONTENT (frontmatter, secret-safety); the
    # folder SHAPE was unchecked, so a hand-written snapshot could ship with an
    # empty resources/ and a wrong file_count and still lint clean.
    - rule-engine-check-snapshot --root examples --strict
    - echo "Verifying the example Snapshot data files are current"
    - python scripts/build_example_snapshots.py --check
    - echo "Verifying the workspace bootstrap works from the installed package"
    # Bootstrap a fresh workspace from the installed engine, then --check it: a
    # payload that ships incompletely in the wheel (build_backend._PAYLOAD /
    # init _BUNDLE_MAP drift) is caught here rather than by a user.
    - |
      ws="$(mktemp -d)"
      rule-engine-init "$ws"
      rule-engine-init --check "$ws"

# ---------------------------------------------------------------------------
# Stage: test (v1.6.1)
#   Run the unit + property-based test suite. Before 1.6.1 the GitLab pipeline
#   ran no tests at all (only GitHub Actions did), so a GitLab tag could package
#   a Release Bundle from a tree whose tests failed.
# ---------------------------------------------------------------------------
test:
  stage: test
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -e ".[dev]"
  script:
    - pytest -q

# ---------------------------------------------------------------------------
# Stage: version-guard
#   On a release trigger (tag), fail-closed BEFORE any Release Bundle is built
#   if the release Semantic Version has NO curated section in CHANGELOG.md
#   (Requirement 10.7). The Changelog is hand-curated, so the release version's
#   section must already exist; a missing entry exits non-zero and stops the
#   pipeline, so build/changelog/publish never run and no archive is ever
#   created. It also `needs: [lint, validate, test]`, so a lint CRITICAL/ERROR
#   (Requirement 10.3) or a failing test short-circuits the release path here.
# ---------------------------------------------------------------------------
version-guard:
  stage: version-guard
  <<: *release_rules
  needs:
    - lint
    - validate
    - test
  before_script:
    - *install
    - export RELEASE_VERSION="${CI_COMMIT_TAG#v}"
  script:
    - echo "Checking that Semantic Version ${RELEASE_VERSION} has a curated section in CHANGELOG.md"
    # Fail-closed when the curated Changelog section is missing (Requirement
    # 10.7). Non-zero exit here stops the pipeline before the build stage
    # packages a bundle.
    - python -m rule_engine.version_guard CHANGELOG.md "${RELEASE_VERSION}"

# ---------------------------------------------------------------------------
# Stage: build
#   On a release trigger (tag), package the Release Bundle containing the
#   steering documents, the mapping files, the Inventory Schema, the examples,
#   and the "add a new provider" runbook. The archive is named with a Semantic
#   Version (Requirement 10.4, 10.5).
#
#   `needs: [lint, validate, test, version-guard]` makes the fail conditions
#   explicit and robust: if the Linter reported a CRITICAL/ERROR (10.3), a test
#   failed, or the version has no curated Changelog section (10.7), those
#   upstream jobs fail and this build job never runs -- so NO Release Bundle is
#   produced. As a defense in depth, the guard is re-run at the start of the
#   build script before the archive is created, and (v1.6.1) the tag,
#   pyproject.toml and the newest CHANGELOG heading must agree (--triple).
# ---------------------------------------------------------------------------
build:
  stage: build
  <<: *release_rules
  needs:
    - lint
    - validate
    - test
    - version-guard
  before_script:
    - *install
    # Derive the Semantic Version from the tag, tolerating an optional leading
    # "v" (v1.2.3 -> 1.2.3). This is the name of the Release Bundle.
    - export RELEASE_VERSION="${CI_COMMIT_TAG#v}"
    - echo "Release Semantic Version = ${RELEASE_VERSION}"
  script:
    # Defense in depth (Requirement 10.7): re-assert the curated Changelog
    # section exists right before packaging, so no archive is created for a
    # version whose changelog entry is missing.
    - echo "Re-checking Semantic Version ${RELEASE_VERSION} has a curated CHANGELOG section before packaging"
    - python -m rule_engine.version_guard CHANGELOG.md "${RELEASE_VERSION}"
    - echo "Packaging the Release Bundle for version ${RELEASE_VERSION}"
    - export BUNDLE_ARCHIVE="${BUNDLE_NAME}-${RELEASE_VERSION}.tar.gz"
    - echo "${RELEASE_VERSION}" > VERSION
    # v1.6.1: VERSION (the tag), pyproject.toml and the newest CHANGELOG.md
    # heading must name one version; fail closed before any archive exists.
    - python -m rule_engine.version_guard --triple .
    # Runbook: the "add a new provider" runbook is the dedicated document
    # docs/add-a-provider.md (Requirement 9 AC9). The spec design document is
    # also bundled for the design-level narrative.
    - |
      tar -czf "${BUNDLE_ARCHIVE}" \
        .kiro/steering/ \
        mappings/ \
        schemas/inventory.schema.json \
        examples/ \
        docs/add-a-provider.md \
        .kiro/specs/multicloud-diagram-inventory/design.md \
        README.md \
        VERSION
    - echo "Built ${BUNDLE_ARCHIVE}"
    - ls -l "${BUNDLE_ARCHIVE}"
  artifacts:
    paths:
      - "${BUNDLE_NAME}-*.tar.gz"
      - VERSION
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Stage: changelog
#   CHANGELOG.md is HAND-CURATED and authoritative: the maintainer writes each
#   release's added/changed/removed narrative before tagging (Requirement 10.6).
#   CI never rewrites it. This stage is non-destructive: it re-verifies (defense
#   in depth) that the released version has a curated section — the version-guard
#   already enforced this (Requirement 10.7) — and passes CHANGELOG.md through as
#   a release artifact. It fails-closed if the curated section is missing.
# ---------------------------------------------------------------------------
changelog:
  stage: changelog
  <<: *release_rules
  needs:
    - version-guard
    - build
  before_script:
    - *install
    - export RELEASE_VERSION="${CI_COMMIT_TAG#v}"
  script:
    - echo "Verifying the curated CHANGELOG.md section for version ${RELEASE_VERSION} (non-destructive; CI does not rewrite it)"
    # Fail-closed when the curated section is missing (Requirement 10.7). CI does
    # NOT modify CHANGELOG.md — the hand-written entry is authoritative and is
    # published as-is.
    - python -m rule_engine.version_guard CHANGELOG.md "${RELEASE_VERSION}"
    - echo "CHANGELOG.md curated section present; publishing as-is"
  artifacts:
    paths:
      - CHANGELOG.md
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Stage: publish
#   On a successful release run, publish the Release Bundle and the updated
#   Changelog as CI artifacts (Requirement 10.10).
# ---------------------------------------------------------------------------
publish:
  stage: publish
  <<: *release_rules
  needs:
    - build
    - changelog
  before_script:
    - export RELEASE_VERSION="${CI_COMMIT_TAG#v}"
  script:
    - echo "Publishing Release Bundle rule-engine-${RELEASE_VERSION}.tar.gz and CHANGELOG.md as artifacts"
    - ls -l "${BUNDLE_NAME}-${RELEASE_VERSION}.tar.gz" CHANGELOG.md
  artifacts:
    name: "${BUNDLE_NAME}-${CI_COMMIT_TAG}"
    paths:
      - "${BUNDLE_NAME}-*.tar.gz"
      - CHANGELOG.md
      - VERSION
    expire_in: never
